<title>AST Tarnos</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:radial-gradient(ellipse at top,#161616 0%,#0a0a0a 60%);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
@keyframes zoomIn{
  0%{transform:scale(.4);opacity:0}
  60%{transform:scale(1.08);opacity:1}
  100%{transform:scale(1);opacity:1}
}
@keyframes fadeUp{
  0%{transform:translateY(14px);opacity:0}
  100%{transform:translateY(0);opacity:1}
}
.logo{width:150px;height:auto;margin-bottom:18px;filter:drop-shadow(0 10px 30px rgba(249,115,22,.35));animation:zoomIn .9s cubic-bezier(.2,.8,.2,1) both}
h1{font-size:26px;letter-spacing:.02em;color:#F97316;margin-bottom:6px;animation:fadeUp .6s ease .5s both}
p{color:#999;font-size:13px;margin-bottom:36px;animation:fadeUp .6s ease .65s both}
.choix{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px;animation:fadeUp .6s ease .8s both}
a{display:block;padding:18px;border-radius:10px;text-decoration:none;font-weight:700;font-size:15px;color:#fff}
.coach{background:linear-gradient(135deg,#F97316,#EA580C)}
.joueur{background:rgba(255,255,255,.08);border:1px solid rgba(249,115,22,.4)}
</style>
