/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;cursor:pointer}
.sp-logo{width:130px;height:130px;object-fit:contain;animation:logoFullscreen 3.2s cubic-bezier(.2,0,.4,1) forwards}
@keyframes logoFullscreen{0%{opacity:0;transform:scale(0.05)}25%{opacity:1;transform:scale(1)}55%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 40px rgba(249,115,22,.9))}100%{opacity:1;transform:scale(60);filter:none}}
.sp-texts{position:absolute;display:flex;flex-direction:column;align-items:center;margin-top:280px;opacity:0;animation:textsFade 3.2s ease forwards}
@keyframes textsFade{0%{opacity:0}30%{opacity:1}60%{opacity:1}80%{opacity:0}100%{opacity:0}}
.sp-line{width:60px;height:2px;background:var(--or);margin:10px auto}
.sp-club{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.sp-sub{font-size:11px;color:var(--or);letter-spacing:.25em;text-transform:uppercase;margin-top:4px;font-family:'Oswald',sans-serif}
.sp-tap{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:.2em;text-transform:uppercase;margin-top:28px;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:.8}}

/* ===== APP SHELL (sidebar façon coach) ===== */
.app{position:fixed;inset:0;z-index:1;display:flex;opacity:0;pointer-events:none;transition:opacity .3s;background:rgba(5,8,5,.42)}
.app.on{opacity:1;pointer-events:auto}
.side{width:190px;flex-shrink:0;background:rgba(8,8,8,.9);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.side-logo{padding:14px 16px;border-bottom:2px solid var(--or);display:flex;align-items:center;gap:10px}
.side-crest{width:30px;height:30px;border:2px solid var(--or);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:10px;color:var(--or);flex-shrink:0}
.side-club{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700}
.side-sub{font-size:8px;color:var(--or);letter-spacing:.15em;text-transform:uppercase;margin-top:1px}
.side-sec{font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--gris2);text-transform:uppercase;padding:12px 16px 4px}
.ni{display:flex;align-items:center;gap:8px;padding:9px 16px;font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;color:#ccc;cursor:pointer;border-left:3px solid transparent}
.ni.on{color:var(--or);background:rgba(249,115,22,.1);border-left-color:var(--or)}
.ni-ic{font-size:14px;width:18px;text-align:center;flex-shrink:0}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px}
.ph{padding:14px 0 10px;margin-bottom:4px}
.ph-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-shadow:0 2px 10px rgba(0,0,0,.95),0 0 20px rgba(0,0,0,.8)}
.ph-sub{font-size:11px;color:#ddd;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,.95)}

.scr{display:none}
.scr.on{display:block}

/* ===== SHARED BLOCKS ===== */
.blk{background:rgba(8,8,8,.92);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.bh{padding:9px 12px;border-bottom:1px solid var(--line);background:rgba(249,115,22,.06);display:flex;align-items:center;justify-content:space-between;gap:8px}
.bt{font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--or)}
.bc{font-size:10px;color:var(--gris2)}
.empty{text-align:center;padding:40px 20px;color:var(--gris2)}
.empty-ic{font-size:32px;margin-bottom:10px;opacity:.5}
.empty-t{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;color:#fff;margin-bottom:6px}
.empty-s{font-size:12px;line-height:1.5}

/* ===== ACCUEIL ===== */
.banner{background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(249,115,22,.05));border:1px solid var(--or);border-radius:8px;padding:14px;margin-bottom:12px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.banner-lbl{font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--or);margin-bottom:6px}
.seance-txt{padding:14px;font-size:13px;line-height:1.8;white-space:pre-wrap}
.next-match{padding:14px}
.nm-vs{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;margin-bottom:4px}
.nm-meta{font-size:11px;color:var(--gris2);line-height:1.6}

/* ===== EFFECTIF / LIST ===== */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;background:rgba(8,8,8,.92);border:1px solid var(--line);border-radius:8px;padding:9px 12px 9px 32px;color:#fff;font-family:'Roboto Condensed',sans-serif;font-size:13px}
.search input::placeholder{color:var(--gris2)}
.search-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5}
.prow{display:flex;align-items:center;gap:10px;background:rgba(8,8,8,.92);border:1px solid var(--line);border-left:3px solid var(--or);border-radius:8px;padding:9px 12px;margin-bottom:7px;cursor:pointer}
.prow:active{background:rgba(249,115,22,.1)}
.prow.top1{border-left-color:var(--gold)}
.prow.top2{border-left-color:var(--silver)}
.prow.top3{border-left-color:var(--bronze)}
.prank{font-family:'Oswald',sans-serif;font-size:15px;font-weight:700;color:var(--gris2);min-width:22px;text-align:center}
.prow.top1 .prank{color:var(--gold)}.prow.top2 .prank{color:var(--silver)}.prow.top3 .prank{color:var(--bronze)}
.pnum{width:26px;height:26px;border-radius:50%;background:rgba(249,115,22,.12);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;color:var(--or);flex-shrink:0}
.pinfo{flex:1;min-width:0}
.pnom{font-size:13px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ppos{font-size:9px;color:var(--gris2);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.pnote{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:var(--gold);min-width:34px;text-align:right}
.pchev{color:var(--gris2);font-size:12px}

/* ===== DETAIL / FIFA CARD ===== */
.detail{position:fixed;inset:0;background:#0a0a0a;z-index:50;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,0,.2,1);display:flex;flex-direction:column}
.detail.on{transform:translateX(0)}
.d-hdr{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.d-back{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0}
.d-hdr-t{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gris)}
.d-body{flex:1;overflow-y:auto;padding:16px}

.fifa-card{background:linear-gradient(135deg,rgba(245,200,66,.12) 0%,rgba(249,115,22,.08) 50%,rgba(8,8,8,.7) 100%);border:2px solid var(--gold);padding:20px;display:flex;gap:20px;margin-bottom:16px;position:relative;overflow:hidden;border-radius:4px}
.fifa-num-bg{font-family:'Oswald',sans-serif;font-size:100px;font-weight:700;color:rgba(245,200,66,.07);position:absolute;right:10px;top:0;line-height:1}
.fifa-left{text-align:center;flex-shrink:0;min-width:80px}
.fifa-note{font-family:'Oswald',sans-serif;font-size:56px;font-weight:700;color:var(--gold);line-height:1}
.fifa-note-max{font-size:13px;color:var(--gris2);font-weight:700}
.fifa-pos{font-size:10px;color:var(--gold);letter-spacing:.1em;font-weight:700;margin-top:2px}
.fifa-rank-lbl{font-size:9px;color:var(--gris2);margin-top:10px;text-transform:uppercase;letter-spacing:.08em}
.fifa-rank-v{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:var(--gold)}
.fifa-rank-v span{font-size:12px;color:var(--gris2)}
.fifa-nom{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;color:#fff;margin-bottom:10px;line-height:1.15}

.fa-item{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.07)}
.fa-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.fa-row{display:flex;align-items:center;gap:12px}
.fa-label{font-size:13px;color:#fff;font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-width:118px;font-family:'Oswald',sans-serif}
.fa-val{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;min-width:42px;text-shadow:0 0 16px currentColor}
.fa-stars{display:flex;gap:3px}
.fa-star{width:10px;height:10px;border-radius:50%;background:#222}
.fa-star.on{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.fa-detail{font-size:13px;font-weight:600;color:var(--gris);margin-top:4px;margin-left:2px}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(249,115,22,.15)}
.stats-cell{text-align:center;padding:12px 6px;background:rgba(10,10,10,.5)}
.stats-cell-l{font-size:9px;color:var(--gris2);font-weight:700;text-transform:uppercase;margin-bottom:4px}
.stats-cell-v{font-family:'Oswald',sans-serif;font-size:19px;font-weight:700}

.obj-item{padding:14px}
.obj-item+.obj-item{border-top:1px solid var(--line)}
.obj-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.obj-lbl{font-size:13px;font-weight:700;color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.02em}
.obj-pct{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;text-shadow:0 0 12px currentColor}
.obj-bar{height:9px;background:rgba(40,40,40,.8);border-radius:5px;margin-bottom:6px;overflow:hidden}
.obj-bar-in{height:100%;border-radius:5px}
.obj-vals{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--gris)}
.obj-vals b{color:var(--or);font-size:13px}
.legend{padding:12px;font-size:11px;color:var(--gris2);line-height:1.6}
.legend b{color:#fff}

/* ===== MATCHS ===== */
.bilan-row{display:flex;gap:8px;margin-bottom:12px}
.bilan-c{flex:1;text-align:center;background:rgba(8,8,8,.92);border:1px solid var(--line);border-radius:8px;padding:12px 6px}
.bilan-v{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700}
.bilan-l{font-size:9px;color:var(--gris2);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.mc{display:flex;align-items:center;gap:12px;background:rgba(8,8,8,.92);border:1px solid var(--line);border-left:4px solid var(--gris2);border-radius:8px;padding:11px 14px;margin-bottom:8px}
.mc.V{border-left-color:var(--green)}.mc.N{border-left-color:var(--gold)}.mc.D{border-left-color:var(--red)}
.mc-score{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;min-width:44px;text-align:center}
.mc-res{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:11px;flex-shrink:0}
.mc.V .mc-res{background:rgba(34,197,94,.18);color:var(--green)}
.mc.N .mc-res{background:rgba(245,200,66,.18);color:var(--gold)}
.mc.D .mc-res{background:rgba(239,68,68,.18);color:var(--red)}

/* ===== VIDEOS ===== */
.vi{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.vi:last-child{border-bottom:none}
.vth{width:88px;height:56px;border-radius:6px;overflow:hidden;position:relative;flex-shrink:0;background:#000}
.vth img{width:100%;height:100%;object-fit:cover;display:block}
.vpl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);color:#fff;font-size:16px}
.vbdg{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:3px;margin-bottom:4px}
.vbdg.ct{background:rgba(249,115,22,.18);color:var(--or)}
.vbdg.ca{background:rgba(239,68,68,.18);color:var(--red)}
.vbdg.ce{background:rgba(56,189,248,.18);color:var(--blue)}

/* ===== CONVOCATIONS ===== */
.conv-hero{padding:16px;text-align:center}
.conv-adv{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;text-transform:uppercase}
.conv-date{font-size:12px;color:var(--or);margin-top:4px}
.conv-lieu{font-size:11px;color:var(--gris2);margin-top:2px}
.eq-list{padding:12px;font-size:13px;line-height:2}
.eq-empty{padding:12px;font-size:12px;color:var(--gris2)}

/* ===== RECAP GLOBAL ===== */
.recap-wrap{overflow-x:auto}
.recap-wrap table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
.recap-wrap th{padding:8px 10px;border-bottom:1px solid var(--line);background:rgba(249,115,22,.1)}
.recap-wrap td{padding:7px 10px}
.recap-wrap td:first-child, .recap-wrap th:first-child{text-align:left;position:sticky;left:0;font-weight:700}
.recap-wrap td:not(:first-child), .recap-wrap th:not(:first-child){text-align:center}

/* ===== POINTS ENTRAINEMENT ===== */
.podium-c{background:rgba(8,8,8,.92);border:1px solid var(--line);border-radius:6px;padding:16px 10px;text-align:center}
.podium-c.p1{border-color:var(--gold);order:2;padding-top:24px}
.podium-c.p2{border-color:var(--silver);order:1}
.podium-c.p3{border-color:var(--bronze);order:3}
.podium-rank{font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--gris2);text-transform:uppercase}
.podium-c.p1 .podium-rank{color:var(--gold)}
.podium-c.p2 .podium-rank{color:var(--silver)}
.podium-c.p3 .podium-rank{color:var(--bronze)}
.podium-med{font-size:26px;margin:4px 0}
.podium-nom{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;margin-bottom:6px;min-height:34px;display:flex;align-items:center;justify-content:center}
.podium-pts{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:var(--gold);line-height:1;text-shadow:0 0 16px rgba(245,200,66,.5)}
.podium-c.p1 .podium-pts{font-size:42px}
.podium-lbl{font-size:9px;color:var(--gris2);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.pt-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid rgba(249,115,22,.08)}
.pt-row:last-child{border-bottom:none}
.pt-rank{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;color:var(--gris2);min-width:26px;text-align:center}
.pt-nom{flex:0 1 260px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-bar-wrap{flex:0 0 180px;height:8px;background:rgba(40,40,40,.8);border-radius:4px;overflow:hidden}
.pt-bar{height:100%;background:linear-gradient(90deg,var(--or),var(--gold));border-radius:4px}
.pt-val{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;color:var(--gold);flex:0 0 56px;text-align:right}

/* ===== BIBLIOTHEQUE SEANCES ===== */
.bp-card{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.bp-card:active{border-color:var(--or)}
.bp-thumb{width:100%;height:110px;object-fit:cover;display:block;background:#111}
.bp-info{padding:8px 10px}
.bp-titre{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-meta{font-size:9px;color:var(--gris2);margin-top:2px;display:flex;justify-content:space-between;align-items:center}
.bp-theme-badge{background:rgba(249,115,22,.15);color:var(--or);padding:1px 6px;border-radius:3px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.bp-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.bp-lightbox img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 0 40px rgba(0,0,0,.8)}
.bp-lightbox-close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer}
</style>

const SUBS = {accueil:'', effectif:' joueurs', matchs:'Résultats de la saison', videos:'Bibliothèque tactique', convos:'Prochain match'};

function openApp(){
  document.getElementById('splash').style.display='none';
  document.getElementById('app').classList.add('on');
  renderAccueil();renderEffectif();renderRecap();renderPointsEntrainement();renderMatchs();renderVideos();renderBiblio();renderConvos();
}

function goTab(el){
  document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('on');});
  document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on');});
  el.classList.add('on');
  var s=el.getAttribute('data-s');
  document.getElementById('scr-'+s).classList.add('on');
  document.querySelector('.main').scrollTop=0;
  if(s==='recap') renderRecap();
  if(s==='points') renderPointsEntrainement();
  if(s==='biblio') renderBiblio();
}

function noData(msg){
  return '<div class="empty"><div class="empty-ic">📋</div><div class="empty-t">Aucune donnée</div><div class="empty-s">'+msg+'</div></div>';
}

/* ===== ACCUEIL ===== */
function renderAccueil(){
  var el=document.getElementById('scr-accueil');
  var PH='<div class="ph"><div class="ph-title">Accueil</div></div>';
  if(!APP_DATA){ el.innerHTML=PH+noData('Ce fichier doit être généré depuis le bouton<br>« ⬇ GÉNÉRER JOUEURS » du coach AST V2.'); return; }
  var html='';
  if(APP_DATA.message && APP_DATA.message.trim()){
    html+='<div class="banner"><div class="banner-lbl">💬 Message du coach</div>'+esc(APP_DATA.message)+'</div>';
  }
  var c=APP_DATA.convos;
  if(c && c.adv){
    html+='<div class="blk"><div class="bh"><span class="bt">⚽ Prochain match</span></div><div class="next-match">'
      +'<div class="nm-vs">AST Tarnos vs '+esc(c.adv)+'</div>'
      +'<div class="nm-meta">'+(c.date?esc(c.date):'Date à confirmer')+(c.lieu?' · '+esc(c.lieu):'')+'</div>'
      +'</div></div>';
  }
  if(APP_DATA.seance && APP_DATA.seance.trim()){
    html+='<div class="blk"><div class="bh"><span class="bt">📝 Séance du jour</span></div><div class="seance-txt">'+esc(APP_DATA.seance)+'</div></div>';
  }
  if(!html){ html=noData('Rien à afficher pour l’instant — le coach n’a pas encore publié de message, séance ou convocation.'); }
  el.innerHTML=PH+html;
}

function esc(t){ var d=document.createElement('div');d.textContent=t;return d.innerHTML.replace(/\n/g,'<br>'); }

/* ===== EFFECTIF ===== */
function renderEffectif(){
  var el=document.getElementById('scr-effectif');
  var PH='<div class="ph"><div class="ph-title">Effectif</div><div class="ph-sub">'+(APP_DATA?APP_DATA.joueurs.length:0)+' joueurs</div></div>';
  if(!APP_DATA || !APP_DATA.joueurs.length){ el.innerHTML=PH+noData('Ce fichier doit être généré depuis le bouton<br>« ⬇ GÉNÉRER JOUEURS » du coach AST V2.'); return; }
  el.innerHTML=PH+'<div class="search"><span class="search-ic">🔍</span><input type="text" id="search" placeholder="Rechercher un joueur..." oninput="renderList()"></div><div id="plist"></div>';
  renderList();
}

  var ranked=APP_DATA.joueurs.map(function(p){return {num:p.num,nom:p.nom,pts:(p.stats&&p.stats.pts)||0};}).sort(function(a,b){return b.pts-a.pts;});
  var maxPts=ranked.length?(ranked[0].pts||1):1;
  var top3=ranked.slice(0,3);
  var podiumHtml=top3.map(function(p,i){
    var cls='p'+(i+1);
    var med=i===0?'🥇':i===1?'🥈':'🥉';
    return '<div class="podium-c '+cls+'"><div class="podium-rank">'+(i+1)+'<sup>'+(i===0?'er':'e')+'</sup></div>'
      +'<div class="podium-med">'+med+'</div><div class="podium-nom">'+esc(p.nom)+'</div>'
      +'<div class="podium-pts">'+p.pts+'</div><div class="podium-lbl">points</div></div>';
  }).join('');
  var listHtml=ranked.map(function(p,i){
    var pct=maxPts>0?Math.round(p.pts/maxPts*100):0;
    return '<div class="pt-row"><div class="pt-rank">'+(i+1)+'</div><div class="pt-nom">'+p.num+'. '+esc(p.nom)+'</div>'
      +'<div class="pt-bar-wrap"><div class="pt-bar" style="width:'+pct+'%"></div></div>'
      +'<div class="pt-val">'+p.pts+' pts</div></div>';
  }).join('');
  el.innerHTML=PH+'<div id="points-podium" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">'+(podiumHtml||'')+'</div>'
    +'<div class="blk"><div class="bh"><span class="bt">Classement complet</span></div><div>'+listHtml+'</div></div>';
}

function renderRecap(){
  var el=document.getElementById('scr-recap');
  var PH='<div class="ph"><div class="ph-title">Récap Global</div><div class="ph-sub">Toutes les stats de l\'effectif</div></div>';
  if(!APP_DATA || !APP_DATA.joueurs.length){ el.innerHTML=PH+noData('Ce fichier doit être généré depuis le bouton<br>« ⬇ GÉNÉRER JOUEURS » du coach AST V2.'); return; }
  var totalButsEquipe=(APP_DATA.matchs||[]).reduce(function(sum,m){return sum+(m.ast||0);},0);
  var rows=APP_DATA.joueurs.map(function(p){
    var s=p.stats||{};
    var ba=(s.buts||0)+(s.pd||0);
    var ratio=totalButsEquipe>0?Math.round(ba/totalButsEquipe*1000)/10:0;
    return '<tr><td>'+p.num+'. '+esc(p.nom)+'</td>'
      +'<td style="font-family:Oswald,sans-serif;font-size:15px;font-weight:700;color:var(--gold)">'+p.note+'/100</td>'
      +'<td style="color:var(--gold);font-weight:700">'+(s.pts||0)+' pts</td>'
      +'<td style="color:var(--red);font-weight:700">'+(s.amendes||0)+' €</td>'
      +'<td style="color:var(--green)">'+(s.pres||0)+'/'+(s.seances||0)+'</td>'
      +'<td>'+(s.titu||0)+'</td>'
      +'<td>'+(s.rempl||0)+'</td>'
      +'<td style="color:var(--or)">'+(s.matchsA||0)+'</td>'
      +'<td style="color:var(--blue)">'+(s.matchsB||0)+'</td>'
      +'<td>'+(s.tpsMoy||0)+' min</td>'
      +'<td>'+(s.tpsTotal||0)+' min</td>'
      +'<td style="color:var(--gold)">'+(s.buts||0)+'</td>'
      +'<td style="color:var(--purple)">'+(s.pd||0)+'</td>'
      +'<td style="color:var(--gold);font-weight:700">'+ba+'</td>'
      +'<td style="color:var(--green)">'+ratio+'%</td></tr>';
  }).join('');
  el.innerHTML=PH+'<div class="blk recap-wrap"><table><thead><tr>'
    +'<th>Joueur</th><th style="color:var(--gold)">Note /100</th><th style="color:var(--gold)">Points entr.</th><th style="color:var(--red)">Amendes</th><th>Présences</th><th>Titu</th><th>Rempl</th><th>Matchs A</th><th>Matchs B</th><th>Tps moy.</th><th>Tps total</th><th>Buts marqués</th><th>Passes décisives</th><th>But+Assist</th><th>% buts équipe</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function renderList(){
  var wrap=document.getElementById('plist');
  var q=(document.getElementById('search').value||'').toLowerCase();
  var sorted=APP_DATA.joueurs.slice().sort(function(a,b){return a.rank-b.rank;});
  wrap.innerHTML=sorted.filter(function(p){return p.nom.toLowerCase().indexOf(q)!==-1;}).map(function(p){
    var cls=p.rank===1?'top1':p.rank===2?'top2':p.rank===3?'top3':'';
    return '<div class="prow '+cls+'" onclick="openDetail('+p.num+')">'
      +'<div class="prank">'+p.rank+'</div>'
      +'<div class="pnum">'+p.num+'</div>'
      +'<div class="pinfo"><div class="pnom">'+p.nom+'</div><div class="ppos">'+(p.gardien?'Gardien':'Joueur de champ')+'</div></div>'
      +'<div class="pnote">'+p.note+'</div>'
      +'<div class="pchev">›</div></div>';
  }).join('');
}

function colorVar(c){ return c || 'var(--or)'; }
function starsH(val,col){var s='';for(var k=0;k<10;k++)s+='<div class="fa-star'+(k<val?' on':'')+'" style="'+(k<val?'background:'+colorVar(col):'')+'"></div>';return s;}

function openDetail(num){
  var p=APP_DATA.joueurs.find(function(x){return x.num===num;});
  if(!p) return;
  var attrsHtml=p.attrs.map(function(a){
    return '<div class="fa-item"><div class="fa-row"><div class="fa-label">'+a.label+'<span style="color:var(--gris2);font-weight:400;text-transform:none"> · '+(a.poids||11.1)+'%</span></div><div class="fa-val" style="color:'+colorVar(a.col)+'">'+a.val+'</div><div class="fa-stars">'+starsH(a.val,a.col)+'</div></div>'
      +(a.detail?'<div class="fa-detail">'+a.detail+' <span style="color:var(--gris)">→ '+(a.contrib!=null?a.contrib:'?')+' pt(s) sur la note</span></div>':'')+'</div>';
  }).join('');

  var s=p.stats||{};
  var statCells=p.gardien
    ? [['Clean sheets',s.cs||0,'var(--green)'],['Buts encaissés',s.butsEnc||0,'var(--red)'],['Matchs joués',s.matchsJoues||0,'var(--or)'],['Cartons jaunes',s.cj||0,'var(--gold)'],['Cartons rouges',s.cr||0,'var(--red)'],['Note moy.',s.notesCount?(s.noteMoy+'/10'):'N/A','var(--gold)']]
    : [['Buts',s.buts||0,'var(--gold)'],['Passes D',s.pd||0,'var(--purple)'],['Matchs joués',s.matchsJoues||0,'var(--or)'],['Cartons jaunes',s.cj||0,'var(--gold)'],['Cartons rouges',s.cr||0,'var(--red)'],['Note moy.',s.notesCount?(s.noteMoy+'/10'):'N/A','var(--gold)']];
  var statsHtml=statCells.map(function(x){
    return '<div class="stats-cell"><div class="stats-cell-l">'+x[0]+'</div><div class="stats-cell-v" style="color:'+x[2]+'">'+x[1]+'</div></div>';
  }).join('');

  var objs=p.objectifs||[];
  var objHtml=objs.length ? objs.map(function(o){
    return '<div class="obj-item"><div class="obj-top"><div class="obj-lbl">'+o.label+'</div><div class="obj-pct" style="color:'+colorVar(o.barColor)+'">'+o.pct+'%</div></div>'
      +'<div class="obj-bar"><div class="obj-bar-in" style="width:'+Math.min(100,o.pct)+'%;background:'+colorVar(o.barColor)+'"></div></div>'
      +'<div class="obj-vals"><span>Actuel : <b>'+o.current+' '+o.unit+'</b></span><span>Cible : <b>'+o.cible+' '+o.unit+'</b></span></div></div>';
  }).join('') : '<div class="legend">Aucun objectif individuel défini pour ce joueur.</div>';

  document.getElementById('d-body').innerHTML =
    '<div class="fifa-card"><div class="fifa-num-bg">'+p.num+'</div>'
    +'<div class="fifa-left"><div class="fifa-note">'+p.note+'<span class="fifa-note-max">/100</span></div>'
    +'<div style="font-size:9px;color:var(--gris2);margin-top:4px">9 attributs<br>× '+(p.attrs[0]&&p.attrs[0].poids?p.attrs[0].poids:11.1)+'% chacun</div>'
    +'<div class="fifa-pos">'+(p.gardien?'GK':'R2')+'</div>'
    +'<div class="fifa-rank-lbl">Rang</div>'
    +'<div class="fifa-rank-v">'+p.rank+'<span> / '+APP_DATA.joueurs.length+'</span></div></div>'
    +'<div style="flex:1;min-width:0"><div class="fifa-nom">'+p.nom+'</div>'+attrsHtml+'</div></div>'
    +'<div class="blk"><div class="bh"><span class="bt">📊 Stats saison</span></div><div class="stats-grid">'+statsHtml+'</div></div>'
    +'<div class="blk"><div class="bh"><span class="bt">🎯 Objectifs individuels</span></div>'+objHtml+'</div>'
    +'<div class="blk"><div class="bh"><span class="bt">Comprendre la note</span></div>'
    +'<div class="legend">La note globale <b>/100</b> est calculée à partir de <b>9 attributs</b> notés sur 10 (détail sous chaque attribut ci-dessus). '
    +'Le classement se met à jour à chaque génération par le coach.</div></div>';

  document.getElementById('detail').classList.add('on');
}
function closeDetail(){ document.getElementById('detail').classList.remove('on'); }

/* ===== MATCHS ===== */
function renderMatchs(){
  var el=document.getElementById('scr-matchs');
  var PH='<div class="ph"><div class="ph-title">Matchs</div><div class="ph-sub">Résultats de la saison</div></div>';
  if(!APP_DATA || !APP_DATA.matchs || !APP_DATA.matchs.length){ el.innerHTML=PH+noData('Aucun match enregistré pour l’instant.'); return; }
  var V=0,N=0,D=0;
  APP_DATA.matchs.forEach(function(m){ if(m.res==='V')V++; else if(m.res==='N')N++; else D++; });
  var html='<div class="bilan-row">'
    +'<div class="bilan-c"><div class="bilan-v" style="color:var(--green)">'+V+'</div><div class="bilan-l">Victoires</div></div>'
    +'<div class="bilan-c"><div class="bilan-v" style="color:var(--gold)">'+N+'</div><div class="bilan-l">Nuls</div></div>'
    +'<div class="bilan-c"><div class="bilan-v" style="color:var(--red)">'+D+'</div><div class="bilan-l">Défaites</div></div>'
    +'</div>';
  html+=APP_DATA.matchs.map(function(m,mi){
    return '<div class="mc '+m.res+'" style="cursor:pointer" onclick="voirNotesMatch('+mi+')"><div class="mc-score">'+m.ast+'-'+m.adv+'</div>'
      +'<div style="flex:1"><div style="font-family:Oswald,sans-serif;font-size:13px;font-weight:700">vs '+esc(m.adversaire||'')+' ('+(m.lieu==='E'?'Ext.':'Dom.')+')</div>'
      +'<div style="font-size:11px;color:var(--gris2);margin-top:2px">'+esc(m.date||'')+(m.comp?' · '+esc(m.comp):'')+(m.cs?' · ✅ Clean sheet':'')+(m.notes&&m.notes.length?' · 👁 Voir les notes':'')+'</div></div>'
      +'<div class="mc-res">'+m.res+'</div></div>';
  }).join('');
  el.innerHTML=PH+html;
}
function voirNotesMatch(mi){
  var m=(APP_DATA&&APP_DATA.matchs)?APP_DATA.matchs[mi]:null;
  if(!m || !m.notes || !m.notes.length) return;
  var lb=document.createElement('div');
  lb.className='bp-lightbox';
  lb.style.alignItems='flex-start';
  lb.style.overflowY='auto';
  lb.onclick=function(e){if(e.target===lb)lb.remove();};
  var rows=m.notes.slice().sort(function(a,b){return b.note-a.note;}).map(function(n){
    var stCol=n.statut==='TA'||n.statut==='TB'?'var(--green)':'var(--or)';
    var stLbl=n.statut==='TA'?'Titu A':n.statut==='TB'?'Titu B':n.statut==='RA'?'Rempl A':'Rempl B';
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid rgba(249,115,22,.08)">'
      +'<div style="flex:1;font-weight:700;font-size:13px">'+n.num+'. '+esc(n.nom)+'</div>'
      +'<div style="font-size:10px;color:'+stCol+';font-weight:700">'+stLbl+'</div>'
      +'<div style="font-size:11px;color:var(--gold)">'+n.buts+'⚽ '+n.pd+'🎯</div>'
      +'<div style="font-family:Oswald,sans-serif;font-size:18px;font-weight:700;color:var(--gold);min-width:36px;text-align:right">'+n.note+'/10</div></div>';
  }).join('');
  lb.innerHTML='<div style="background:rgba(10,10,10,.97);border:1px solid var(--or);border-radius:8px;max-width:480px;width:100%;margin:40px auto" onclick="event.stopPropagation()">'
    +'<div class="bh"><span class="bt">Notes — vs '+esc(m.adversaire||'')+' ('+m.ast+'-'+m.adv+')</span></div>'+rows+'</div>';
  document.body.appendChild(lb);
}

/* ===== VIDEOS ===== */
/* ===== BIBLIOTHEQUE SEANCES ===== */
function renderBiblio(){
  var el=document.getElementById('scr-biblio');
  var PH='<div class="ph"><div class="ph-title">📸 Bibliothèque Séances</div><div class="ph-sub">Toutes les séances passées, en photo</div></div>';
  var lib=(APP_DATA&&APP_DATA.biblio)||[];
  if(!lib.length){ el.innerHTML=PH+noData('Aucune séance publiée par le coach pour l’instant.'); return; }
  var grid=lib.map(function(s,i){
    return '<div class="bp-card" onclick="openLightbox('+i+')">'
      +'<img class="bp-thumb" src="'+s.img+'" alt="">'
      +'<div class="bp-info"><div class="bp-titre">'+esc(s.titre||'')+'</div>'
      +'<div class="bp-meta"><span class="bp-theme-badge">'+esc(s.theme||'')+'</span><span>'+esc(s.date||'')+'</span></div>'
      +'</div></div>';
  }).join('');
  el.innerHTML=PH+'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">'+grid+'</div>';
}
function openLightbox(idx){
  var lib=(APP_DATA&&APP_DATA.biblio)||[];
  var s=lib[idx];
  if(!s) return;
  var lb=document.createElement('div');
  lb.className='bp-lightbox';
  lb.onclick=function(){lb.remove();};
  lb.innerHTML='<span class="bp-lightbox-close">✕</span><img src="'+s.img+'">';
  document.body.appendChild(lb);
}

/* ===== VIDEOS ===== */
function renderVideos(){
  var el=document.getElementById('scr-videos');
  var PH='<div class="ph"><div class="ph-title">Vidéos</div><div class="ph-sub">Bibliothèque tactique</div></div>';
  if(!APP_DATA || !APP_DATA.videos || !APP_DATA.videos.length){ el.innerHTML=PH+noData('Aucune vidéo publiée pour l’instant.'); return; }
  var cc={Adversaire:'ca',Tactique:'ct',Entrainement:'ce'};
  var html='<div class="blk">'+APP_DATA.videos.map(function(v){
    var yt=(v.url||'').match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
    var ytid=yt?yt[1]:null;
    return '<a class="vi" href="'+v.url+'" target="_blank" rel="noopener">'
      +'<div class="vth">'+(ytid?'<img src="https://img.youtube.com/vi/'+ytid+'/mqdefault.jpg" alt="">':'')+'<div class="vpl">▶</div></div>'
      +'<div style="flex:1;min-width:0"><span class="vbdg '+(cc[v.categorie]||'ct')+'">'+esc(v.categorie||'')+'</span>'
      +'<div style="font-family:Oswald,sans-serif;font-size:13px;font-weight:700;margin-bottom:2px">'+esc(v.titre||'')+'</div>'
      +(v.notes?'<div style="font-size:10px;color:var(--gris2)">'+esc(v.notes)+'</div>':'')
      +'</div></a>';
  }).join('')+'</div>';
  el.innerHTML=PH+html;
}

/* ===== CONVOCATIONS ===== */
function renderConvos(){
  var el=document.getElementById('scr-convos');
  var PH='<div class="ph"><div class="ph-title">Convocations</div><div class="ph-sub">Prochain match</div></div>';
  var c=APP_DATA?APP_DATA.convos:null;
  if(!c || !c.adv){ el.innerHTML=PH+noData('Aucune convocation publiée pour l’instant.'); return; }
  function listBlock(title,arr,cls){
    return '<div class="blk" style="margin:0"><div class="bh"><span class="bt '+(cls||'')+'">'+title+'</span></div>'
      +(arr&&arr.length?'<div class="eq-list">'+arr.map(esc).join('<br>')+'</div>':'<div class="eq-empty">—</div>')+'</div>';
  }
  var html='<div class="blk"><div class="conv-hero">'
    +'<div class="conv-adv">AST Tarnos vs '+esc(c.adv)+'</div>'
    +'<div class="conv-date">'+esc(c.date||'Date à confirmer')+'</div>'
    +(c.lieu?'<div class="conv-lieu">'+esc(c.lieu)+'</div>':'')
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">'
    +listBlock('Équipe A',c.a)+listBlock('Équipe B',c.b)
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
    +listBlock('🚑 Blessés',c.bl,'r')+listBlock('🟥 Suspendus',c.su,'go')
    +'</div>';
  el.innerHTML=PH+html;
}
</script>
</body>
</html>
