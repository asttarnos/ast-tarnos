<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F97316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AST Joueur">
<title>AST Tarnos — Espace Joueur</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--or:#F97316;--or2:#EA580C;--blanc:#fff;--gris:#ddd;--gris2:#999;--green:#22c55e;--red:#ef4444;--gold:#f5c842;--blue:#38bdf8;--purple:#a855f7;--line:rgba(249,115,22,.25);--bg:#0a0a0a;--card:#141414}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:#fff;overflow-x:hidden}
body{background:radial-gradient(ellipse at top,#161616 0%,#0a0a0a 60%);padding-bottom:74px;min-height:100vh}
.hidden{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.brand-title{font-family:'Anton',sans-serif;letter-spacing:.03em;color:var(--or);font-size:22px;text-transform:uppercase}
.brand-sub{font-size:11px;color:var(--gris2);margin-top:2px}
/* --- Ecran "qui es-tu" --- */
#scr-login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#scr-login .brand-title{font-size:30px;margin-bottom:4px}
#scr-login .sub{color:var(--gris2);font-size:13px;margin-bottom:28px}
.fi{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;color:#fff;padding:12px 14px;font-size:15px;font-family:inherit}
.fi:focus{outline:none;border-color:var(--or)}
.btn-or{width:100%;background:linear-gradient(135deg,var(--or),var(--or2));border:none;color:#fff;font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:13px;padding:14px;border-radius:8px;margin-top:14px;cursor:pointer}
.btn-or:disabled{opacity:.4}
.err-msg{color:var(--red);font-size:12px;margin-top:10px}
.loading-msg{color:var(--gris2);font-size:12px;margin-top:10px}
/* --- Header appli --- */
#app-header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
#app-header .joueur-nom{font-size:13px;color:var(--gris);font-weight:600}
#app-header .changer{font-size:10px;color:var(--gris2);text-decoration:underline;cursor:pointer;margin-top:2px}
/* --- Blocs contenu --- */
.blk{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.blk-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.blk-h .t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--or)}
.blk-body{padding:14px}
.actu-item{background:rgba(255,255,255,.03);border-left:3px solid var(--or);border-radius:5px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.actu-date{font-size:10px;color:var(--gris2);margin-top:6px}
.convoc-adv{font-family:'Anton',sans-serif;font-size:19px;color:#fff}
.convoc-meta{font-size:12px;color:var(--gris2);margin-top:4px}
.statut-badge{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.statut-a{background:rgba(34,197,94,.15);color:var(--green);border:1px solid var(--green)}
.statut-b{background:rgba(56,189,248,.15);color:var(--blue);border:1px solid var(--blue)}
.statut-bl{background:rgba(239,68,68,.15);color:var(--red);border:1px solid var(--red)}
.statut-inconnu{background:rgba(255,255,255,.06);color:var(--gris2);border:1px solid var(--line)}
.plan-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.plan-item:last-child{border-bottom:none}
.plan-date{font-size:11px;color:var(--or);font-weight:700;min-width:70px}
.plan-theme{font-size:13px;color:#fff;flex:1;padding-left:10px}
.empty-txt{font-size:12px;color:var(--gris2);text-align:center;padding:6px 0}
.soon{text-align:center;padding:60px 24px;color:var(--gris2)}
.soon .ic{font-size:38px;margin-bottom:12px}
.soon .t{font-size:15px;color:#fff;font-weight:700;margin-bottom:6px}
.soon .d{font-size:12px}
/* --- Nav bas --- */
#bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,10,10,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.nav-btn{flex:1;min-width:52px;background:none;border:none;color:var(--gris2);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;font-family:inherit}
.nav-btn .ic{font-size:17px}
.nav-btn .lb{font-size:8px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.nav-btn.on{color:var(--or)}
#bottom-nav{overflow-x:auto;scrollbar-width:none}
#bottom-nav::-webkit-scrollbar{display:none}
/* --- Effectif / classement --- */
.podium-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.podium-c{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:12px 6px;text-align:center}
.podium-c.p1{border-color:var(--gold);background:rgba(245,200,66,.08)}
.podium-rank{font-family:'Anton',sans-serif;font-size:16px;color:var(--gris2)}
.podium-med{font-size:22px;margin:4px 0}
.podium-nom{font-size:10.5px;color:#fff;font-weight:600;line-height:1.2;min-height:24px}
.podium-pts{font-family:'Anton',sans-serif;font-size:17px;color:var(--gold)}
.podium-lbl{font-size:8px;color:var(--gris2);text-transform:uppercase}
.pt-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.pt-row:last-child{border-bottom:none}
.pt-rank{width:20px;color:var(--gris2);font-weight:700}
.pt-nom{flex:1;color:#fff}
.pt-val{color:var(--gold);font-weight:700;min-width:52px;text-align:right}
.effectif-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}
.effectif-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.effectif-nom{font-size:13px;font-weight:700;color:#fff}
.effectif-note{font-family:'Anton',sans-serif;color:var(--or);font-size:14px}
.effectif-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.effectif-chip{text-align:center}
.effectif-chip .l{font-size:8px;color:var(--gris2);text-transform:uppercase}
.effectif-chip .v{font-size:12px;font-weight:700;color:#fff}
.code-gate{text-align:center;padding:50px 24px}
.code-gate .ic{font-size:32px;margin-bottom:10px}
.obj-bar-bg{background:rgba(255,255,255,.08);border-radius:8px;height:8px;overflow:hidden;margin-top:6px}
.obj-bar-fill{height:100%;background:var(--or);border-radius:8px}
.tableau-saison{width:100%;border-collapse:collapse;font-size:10.5px}
.tableau-saison td{padding:5px 4px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.tableau-saison td:first-child,.tableau-saison td:nth-child(2){text-align:left}
</style>
</head>
<body>

<div id="scr-login">
  <div class="brand-title">AST TARNOS</div>
  <div class="brand-sub">Espace Joueur — R2</div>
  <div class="sub" style="margin-top:20px">Qui es-tu ?</div>
  <select class="fi" id="login-select"><option value="">Chargement de l'effectif...</option></select>
  <button class="btn-or" id="login-btn" disabled onclick="validerLogin()">C'est parti</button>
  <div id="login-err" class="err-msg hidden"></div>
</div>

<div id="app" class="hidden">
  <div id="app-header">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="brand-title" style="font-size:15px">AST TARNOS</div>
      <span onclick="actualiserDonnees(true)" style="cursor:pointer;font-size:15px" title="Actualiser">🔄</span>
    </div>
    <div style="text-align:right">
      <div class="joueur-nom" id="hdr-nom">—</div>
      <div class="changer" onclick="changerJoueur()">changer de joueur</div>
    </div>
  </div>

  <div class="wrap">
    <div id="scr-accueil" class="screen"></div>
    <div id="scr-effectif" class="screen hidden"></div>
    <div id="scr-saison" class="screen hidden"></div>
    <div id="scr-planning" class="screen hidden"></div>
    <div id="scr-convocations" class="screen hidden"></div>
    <div id="scr-seances" class="screen hidden"></div>
    <div id="scr-videos" class="screen hidden"></div>
    <div id="scr-messages" class="screen hidden"></div>
    <div id="scr-coach" class="screen hidden"></div>
  </div>

  <div id="bottom-nav">
    <button class="nav-btn on" data-s="accueil" onclick="goNav('accueil')"><span class="ic">🏠</span><span class="lb">Accueil</span></button>
    <button class="nav-btn" data-s="effectif" onclick="goNav('effectif')"><span class="ic">🏆</span><span class="lb">Effectif</span></button>
    <button class="nav-btn" data-s="saison" onclick="goNav('saison')"><span class="ic">📊</span><span class="lb">Saison</span></button>
    <button class="nav-btn" data-s="planning" onclick="goNav('planning')"><span class="ic">📅</span><span class="lb">Planning</span></button>
    <button class="nav-btn" data-s="convocations" onclick="goNav('convocations')"><span class="ic">📋</span><span class="lb">Convoc.</span></button>
    <button class="nav-btn" data-s="seances" onclick="goNav('seances')"><span class="ic">🎯</span><span class="lb">Séances</span></button>
    <button class="nav-btn" data-s="videos" onclick="goNav('videos')"><span class="ic">🎥</span><span class="lb">Vidéos</span></button>
    <button class="nav-btn" data-s="messages" onclick="goNav('messages')"><span class="ic">💬</span><span class="lb">Messages</span></button>
    <button class="nav-btn" data-s="coach" onclick="goNav('coach')"><span class="ic">🔒</span><span class="lb">Coach</span></button>
  </div>
</div>

<script>
var FIREBASE_PROJECT_ID_DEFAUT='notes-match-ast';
var FIREBASE_PROJECT_ID=(function(){ try{ return localStorage.getItem('ast_firebase_project_id')||FIREBASE_PROJECT_ID_DEFAUT; }catch(e){ return FIREBASE_PROJECT_ID_DEFAUT; } })();
var FIRESTORE_BASE='https://firestore.googleapis.com/v1/projects/'+FIREBASE_PROJECT_ID+'/databases/(default)/documents';

var SAISON=null; // données chargées depuis Firestore (saison/main)
var MON_NUM=null, MON_NOM=null;

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

async function chargerSaison(){
  var res=await fetch(FIRESTORE_BASE+'/saison/main');
  if(!res.ok) throw new Error('HTTP '+res.status);
  var doc=await res.json();
  var raw=doc.fields && doc.fields.data ? doc.fields.data.stringValue : null;
  if(!raw) throw new Error('Aucune donnée de saison synchronisée pour le moment');
  SAISON=JSON.parse(raw);
  return SAISON;
}

function init(){
  var savedNum=localStorage.getItem('ast_joueur_num');
  var savedNom=localStorage.getItem('ast_joueur_nom');
  if(savedNum!==null && savedNom){
    MON_NUM=parseInt(savedNum); MON_NOM=savedNom;
    demarrerApp();
  }else{
    initLogin();
  }
}

async function initLogin(){
  var sel=document.getElementById('login-select');
  try{
    await chargerSaison();
    var joueurs=(SAISON.JOUEURS||[]).slice().sort(function(a,b){return (a.nom||'').localeCompare(b.nom||'');});
    if(!joueurs.length){
      sel.innerHTML='<option value="">Aucun joueur trouvé</option>';
      return;
    }
    sel.innerHTML='<option value="">— Sélectionne ton nom —</option>'+joueurs.map(function(j){
      return '<option value="'+j.num+'|'+esc(j.nom)+'">'+esc(j.num)+'. '+esc(j.nom)+'</option>';
    }).join('');
    sel.disabled=false;
    document.getElementById('login-btn').disabled=false;
  }catch(e){
    document.getElementById('login-err').textContent='⚠ Impossible de charger l\'effectif ('+e.message+'). Vérifie ta connexion et réessaie.';
    document.getElementById('login-err').classList.remove('hidden');
    sel.innerHTML='<option value="">Erreur de chargement</option>';
  }
}

function validerLogin(){
  var sel=document.getElementById('login-select');
  var val=sel.value;
  if(!val) return;
  var parts=val.split('|');
  MON_NUM=parseInt(parts[0]); MON_NOM=parts.slice(1).join('|');
  localStorage.setItem('ast_joueur_num',MON_NUM);
  localStorage.setItem('ast_joueur_nom',MON_NOM);
  demarrerApp();
}

function changerJoueur(){
  if(!confirm('Changer de joueur ? Tu devras te resélectionner dans la liste.')) return;
  localStorage.removeItem('ast_joueur_num');
  localStorage.removeItem('ast_joueur_nom');
  location.reload();
}

async function demarrerApp(){
  document.getElementById('scr-login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('hdr-nom').textContent=MON_NOM;
  if(!SAISON){
    try{ await chargerSaison(); }catch(e){
      document.getElementById('scr-accueil').innerHTML='<div class="blk"><div class="blk-body"><div class="err-msg">⚠ Impossible de charger les données ('+esc(e.message)+'). Tire vers le bas pour réessayer ou relance l\'appli.</div></div></div>';
      return;
    }
  }
  renderAccueil();
  renderObjectifsEtSondages();
  renderEffectif();
  renderPlanning();
  renderConvocations();
  renderSeances();
  renderVideosJoueur();
  renderSaison();
  renderCoach();
  renderPlaceholders();
}

function goNav(s){
  document.querySelectorAll('.screen').forEach(function(el){ el.classList.add('hidden'); });
  document.getElementById('scr-'+s).classList.remove('hidden');
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.toggle('on', b.dataset.s===s); });
  if(s==='accueil'||s==='effectif'||s==='planning'||s==='convocations'||s==='seances'||s==='videos'||s==='saison'||s==='coach') actualiserDonnees(false);
}
async function actualiserDonnees(manuel){
  try{
    await chargerSaison();
    renderAccueil();
    renderObjectifsEtSondages();
    renderEffectif();
    renderPlanning();
    renderConvocations();
    renderSeances();
    renderVideosJoueur();
    renderSaison();
    renderCoach();
    if(manuel) notif('✓ Données à jour');
  }catch(e){
    if(manuel) notif('⚠ Impossible d\'actualiser — vérifie ta connexion');
  }
}
function notif(msg){
  var n=document.createElement('div');
  n.textContent=msg;
  n.style.cssText='position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(10,10,10,.95);border:1px solid var(--or);color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;z-index:100';
  document.body.appendChild(n);
  setTimeout(function(){ n.remove(); },2200);
}

function parseDateFr(str){
  // format attendu jj/mm/aaaa
  if(!str) return null;
  var m=str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
}

function renderAccueil(){
  var ct=document.getElementById('scr-accueil');
  var html='';

  // Dernière actualité du coach
  var actus=SAISON.ACTUALITES||[];
  html+='<div class="blk"><div class="blk-h"><span class="t">📣 Le mot du coach</span></div><div class="blk-body">';
  if(actus.length){
    html+='<div class="actu-item">'+esc(actus[0].texte)+'</div><div class="actu-date">'+esc(actus[0].date||'')+'</div>';
  }else if(SAISON.MESSAGE){
    html+='<div class="actu-item">'+esc(SAISON.MESSAGE)+'</div>';
  }else{
    html+='<div class="empty-txt">Aucune actualité pour le moment</div>';
  }
  html+='</div></div>';

  // Ma convocation (convocation en cours de préparation par le coach)
  var conv=SAISON.CONVOS||{};
  html+='<div class="blk"><div class="blk-h"><span class="t">📋 Ma convocation</span></div><div class="blk-body">';
  if(conv.adv){
    html+='<div class="convoc-adv">vs '+esc(conv.adv)+'</div>';
    html+='<div class="convoc-meta">'+esc(conv.date||'Date à confirmer')+(conv.lieu?' — '+esc(conv.lieu):'')+'</div>';
    var nomsA=(conv.a||[]).map(function(n){return (n||'').toLowerCase().trim();});
    var nomsB=(conv.b||[]).map(function(n){return (n||'').toLowerCase().trim();});
    var nomsBl=(conv.bl||[]).map(function(n){return (n||'').toLowerCase().trim();});
    var monNomLc=(MON_NOM||'').toLowerCase().trim();
    if(nomsA.indexOf(monNomLc)!==-1){
      html+='<div class="statut-badge statut-a">✓ Convoqué — Équipe A</div>';
    }else if(nomsB.indexOf(monNomLc)!==-1){
      html+='<div class="statut-badge statut-b">✓ Convoqué — Équipe B</div>';
    }else if(nomsBl.indexOf(monNomLc)!==-1){
      html+='<div class="statut-badge statut-bl">🏥 Signalé indisponible</div>';
    }else{
      html+='<div class="statut-badge statut-inconnu">Pas encore annoncé</div>';
    }
  }else{
    html+='<div class="empty-txt">Aucune convocation en préparation pour le moment</div>';
  }
  html+='</div></div>';

  // Prochaines séances (planning mensuel, dates futures uniquement)
  var planning=(SAISON.PLANNING_MENSUEL||[]).map(function(p){ return {raw:p, d:parseDateFr(p.date)}; })
    .filter(function(x){ return x.d && x.d>=new Date(new Date().setHours(0,0,0,0)); })
    .sort(function(a,b){ return a.d-b.d; })
    .slice(0,3);
  html+='<div class="blk"><div class="blk-h"><span class="t">📅 Prochaines séances</span></div><div class="blk-body">';
  if(planning.length){
    html+=planning.map(function(x){
      return '<div class="plan-item"><div class="plan-date">'+esc(x.raw.date)+'</div><div class="plan-theme">'+esc(x.raw.theme||'')+'</div></div>';
    }).join('');
  }else{
    html+='<div class="empty-txt">Aucune séance programmée à venir pour le moment</div>';
  }
  html+='</div></div>';

  // Mes dernières notes de match (mêmes 4 critères que côté coach)
  var CRITERES=[{k:'consignes',lab:'Respect des consignes',ic:'📋'},{k:'offensif',lab:'Apport offensif',ic:'⚔️'},{k:'defensif',lab:'Apport défensif',ic:'🛡️'},{k:'esprit',lab:"État d'esprit",ic:'🔥'}];
  var mesNotes=[];
  (SAISON.MATCHS||[]).forEach(function(m){
    var n=(m.notes||[]).find(function(x){ return x.num===MON_NUM; });
    if(n) mesNotes.push({m:m,n:n});
  });
  mesNotes=mesNotes.slice(0,3);
  html+='<div class="blk"><div class="blk-h"><span class="t">⭐ Mes dernières notes</span></div><div class="blk-body">';
  if(mesNotes.length){
    html+=mesNotes.map(function(x){
      var m=x.m,n=x.n,nd=n.noteDetail||{consignes:3,offensif:3,defensif:3,esprit:3};
      return '<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)">'
        +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'
        +'<div><b style="color:#fff;font-size:13px">vs '+esc(m.adversaire||'')+'</b><span style="color:var(--gris2);font-size:10.5px;margin-left:6px">'+esc(m.date||'')+'</span></div>'
        +'<div style="color:var(--gold);font-family:Anton,sans-serif;font-size:15px">'+(n.note||0)+'/6</div></div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 14px">'
        +CRITERES.map(function(c){
          var v=nd[c.k]||0;
          var etoiles='';
          for(var i=1;i<=6;i++){ etoiles+='<span style="font-size:15px;color:'+(i<=v?'#fbbf24':'#3a3a3a')+'">★</span>'; }
          return '<div><div style="font-size:10px;color:var(--gris2);margin-bottom:3px">'+c.ic+' '+c.lab+'</div><div>'+etoiles+'</div></div>';
        }).join('')
        +'</div></div>';
    }).join('');
  }else{
    html+='<div class="empty-txt">Aucune note enregistrée pour l\'instant</div>';
  }
  html+='</div></div>';

  ct.innerHTML=html;
}

function calcNoteJoueur(idx){
  var j=SAISON.JOUEURS[idx], s=SAISON.STATS[idx], am=(SAISON.ATTRS_MANUELS||[])[idx]||{tech:7,phys:7,ment:7,gardien:false};
  if(!j||!s) return 50;
  var pres=s.seances>0?Math.round(s.pres/s.seances*100):0;
  var engage=Math.min(10,Math.round((s.pts||0)/20));
  var nbMatchs=(SAISON.MATCHS||[]).length;
  var tpsJeu=nbMatchs>0?Math.min(10,Math.round((s.matchsA||0)/nbMatchs*10)):0;
  var disc=Math.max(0,10-((s.cj||0)*2)-((s.cr||0)*5));

function fexNormaliserNom(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }

// ===== Calendrier / Classements / Bilan (calculs identiques à coach.html) =====
function renderCalendrierMensuel(){
  var cal=SAISON.CALENDRIER||[];
  if(!cal.length) return '<div class="empty-txt">Calendrier non synchronisé pour l\'instant</div>';
  var matchsR2=(SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).slice().reverse();
  var utilises=matchsR2.map(function(){return false;});
  var vusCal={};
  return '<table class="tableau-saison"><tr style="color:var(--gris2)"><td>J</td><td>Adversaire</td><td>Lieu</td><td>Score</td></tr>'
    +cal.filter(function(f){return f.comp==='R2';}).map(function(f,idx){
      var k=fexNormaliserNom(f.adversaire);
      vusCal[k]=(vusCal[k]||0)+1;
      var occ=vusCal[k],compteur=0,mt=null,mi=-1;
      for(var i=0;i<matchsR2.length;i++){
        if(utilises[i]) continue;
        if(fexNormaliserNom(matchsR2[i].adversaire)===k){ compteur++; if(compteur===occ){ mt=matchsR2[i]; mi=i; break; } }
      }
      if(mt) utilises[mi]=true;
      return '<tr'+(mt?'':' style="opacity:.45"')+'><td style="color:var(--or);font-weight:700">J'+(idx+1)+'</td><td>'+esc(f.adversaire)+'</td><td>'+(f.lieu==='D'?'🏠':'✈')+'</td><td>'+(mt?(mt.ast+'-'+mt.adv+' '+mt.res):'—')+'</td></tr>';
    }).join('')+'</table>';
}
function calculerClassementAuto(){
  var stats={},NOM_CLUB=SAISON.NOM_CLUB||'AST Tarnos';
  function ligne(nom){ if(!stats[nom]) stats[nom]={equipe:nom,j:0,v:0,n:0,d:0,bp:0,bc:0,pts:0}; return stats[nom]; }
  function appliquer(a,b,sa,sb){
    var la=ligne(a),lb=ligne(b);
    la.j++; lb.j++; la.bp+=sa; la.bc+=sb; lb.bp+=sb; lb.bc+=sa;
    if(sa>sb){la.v++;la.pts+=3;lb.d++;} else if(sa<sb){lb.v++;lb.pts+=3;la.d++;} else {la.n++;lb.n++;la.pts+=1;lb.pts+=1;}
  }
  (SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).forEach(function(m){ appliquer(NOM_CLUB,m.adversaire,m.ast,m.adv); });
  (SAISON.AUTRES_RESULTATS||[]).forEach(function(r){ appliquer(r.eq1,r.eq2,r.s1,r.s2); });
  return Object.keys(stats).map(function(k){return stats[k];}).sort(function(a,b){ return (b.pts-a.pts)||((b.bp-b.bc)-(a.bp-a.bc))||(b.bp-a.bp); });
}
function calculerClassementParLieu(filtreLieu){
  var stats={},NOM_CLUB=SAISON.NOM_CLUB||'AST Tarnos';
  function ligne(nom){ if(!stats[nom]) stats[nom]={equipe:nom,j:0,v:0,n:0,d:0,bp:0,bc:0,pts:0}; return stats[nom]; }
  function crediter(nom,sp,sc){ var l=ligne(nom); l.j++; l.bp+=sp; l.bc+=sc; if(sp>sc){l.v++;l.pts+=3;} else if(sp<sc){l.d++;} else {l.n++;l.pts+=1;} }
  (SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).forEach(function(m){
    var estDom=m.lieu==='D';
    if(filtreLieu==='D'&&estDom) crediter(NOM_CLUB,m.ast,m.adv);
    if(filtreLieu==='E'&&!estDom) crediter(NOM_CLUB,m.ast,m.adv);
  });
  (SAISON.AUTRES_RESULTATS||[]).forEach(function(r){
    if(filtreLieu==='D') crediter(r.eq1,r.s1,r.s2);
    if(filtreLieu==='E') crediter(r.eq2,r.s2,r.s1);
  });
  return Object.keys(stats).map(function(k){return stats[k];}).sort(function(a,b){ return (b.pts-a.pts)||((b.bp-b.bc)-(a.bp-a.bc))||(b.bp-a.bp); });
}
function tableClassement(sorted){
  var NOM_CLUB=SAISON.NOM_CLUB||'AST Tarnos';
  if(!sorted.length) return '<div class="empty-txt">Aucun résultat pour l\'instant</div>';
  return sorted.map(function(e,rang){
    var isTarnos=e.equipe===NOM_CLUB;
    return '<div class="pt-row"'+(isTarnos?' style="color:var(--or);font-weight:700"':'')+'><div class="pt-rank">'+(rang+1)+'</div><div class="pt-nom">'+esc(e.equipe)+'</div><div style="font-size:10px;color:var(--gris2);margin-right:8px">'+e.bp+'-'+e.bc+'</div><div class="pt-val">'+e.pts+' pts</div></div>';
  }).join('');
}
function calculerBilanCategorise(){
  var r2=(SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).slice().reverse();
  var vus={};
  var cats={aller:{J:0,V:0,N:0,D:0,BP:0,BC:0},retour:{J:0,V:0,N:0,D:0,BP:0,BC:0},dom:{J:0,V:0,N:0,D:0,BP:0,BC:0},ext:{J:0,V:0,N:0,D:0,BP:0,BC:0}};
  function acc(cat,m){ cat.J++; cat.BP+=(m.ast||0); cat.BC+=(m.adv||0); if(m.res==='V')cat.V++; else if(m.res==='N')cat.N++; else cat.D++; }
  r2.forEach(function(m){
    var clef=fexNormaliserNom(m.adversaire);
    vus[clef]=(vus[clef]||0)+1;
    var phase=vus[clef]<=1?'aller':'retour';
    acc(cats[phase],m);
    acc(m.lieu==='D'?cats.dom:cats.ext,m);
  });
  return cats;
}

  var cats=calculerBilanCategorise();

  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+defs.map(function(d){
    var c=cats[d.k],diff=c.BP-c.BC;
    return '<div style="background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:6px;padding:8px 10px">'
      +'<div style="font-size:10.5px;font-weight:700;margin-bottom:6px">'+d.lab+' <span style="color:var(--gris2);font-weight:400">('+c.J+' j.)</span></div>'
      +'<div style="font-size:10px;color:var(--gris2)">V<b style="color:var(--green)"> '+c.V+'</b> N<b style="color:var(--gold)"> '+c.N+'</b> D<b style="color:var(--red)"> '+c.D+'</b></div>'
      +'<div style="font-size:10px;color:var(--gris2);margin-top:2px">'+c.BP+'-'+c.BC+' <span style="color:'+(diff>0?'var(--green)':diff<0?'var(--red)':'var(--gris2)')+'">('+(diff>0?'+':'')+diff+')</span></div></div>';
  }).join('')+'</div>';
}

  html+='</div></div>';
  var objColl=SAISON.OBJ_COLL||[];
  html+='<div class="blk"><div class="blk-h"><span class="t">🤝 Objectifs collectifs</span></div><div class="blk-body">';
  html+=objColl.length?objColl.map(function(o){
    var pct=o.cible>0?Math.min(100,Math.round((o.actuel||0)/o.cible*100)):0;
    return '<div style="margin-bottom:10px"><div style="font-size:12px;color:#fff">'+(o.icon||'🎯')+' '+esc(o.label||'')+'</div>'
      +'<div style="font-size:10px;color:var(--gris2)">'+(o.actuel||0)+' / '+o.cible+' '+esc(o.unit||'')+'</div>'
      +'<div class="obj-bar-bg"><div class="obj-bar-fill" style="width:'+pct+'%"></div></div></div>';
  }).join(''):'<div class="empty-txt">Aucun objectif collectif pour l\'instant</div>';
  html+='</div></div>';
  var sondages=(SAISON.SONDAGES||[]).filter(function(s){return s.actif;});
  html+='<div class="blk"><div class="blk-h"><span class="t">📊 Sondage en cours</span></div><div class="blk-body">';
  html+=sondages.length?sondages.map(function(s){
    return '<div style="margin-bottom:10px"><div style="font-size:12px;color:#fff;margin-bottom:6px">'+esc(s.question||'')+'</div>'
      +(s.options||[]).map(function(o){ return '<div style="font-size:11px;color:var(--gris2);padding:4px 8px;background:rgba(255,255,255,.03);border-radius:5px;margin-bottom:3px">'+esc(typeof o==='string'?o:(o.texte||''))+'</div>'; }).join('')
      +'</div>';
  }).join(''):'<div class="empty-txt">Aucun sondage en cours</div>';
  html+='</div></div>';
  ct.insertAdjacentHTML('beforeend',html);
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
