<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AST Tarnos · le match</title>
<meta name="description" content="Le match de l'AST Tarnos en direct : score, minute, buteurs.">
<meta name="theme-color" content="#0B0A09">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="match.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AST Match">
<meta property="og:title" content="AST Tarnos · le match en direct">
<meta property="og:description" content="Le score et la minute, en direct du bord du terrain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fond:#F3EFE7;--carte:#FFFFFF;--ink:#14130F;--mute:#6E685D;--line:rgba(20,19,15,.12);--or:#E2561F;--or2:#B8410F;--green:#1E7A4C}
html.live{--fond:#0B0A09;--carte:#1A1916;--ink:#F2EEE6;--mute:#B8B1A4;--line:rgba(242,238,230,.14);--or2:#FF7A45;--green:#3DBA7E}
@media (prefers-color-scheme:dark){:root:not(.clair){--fond:#0B0A09;--carte:#1A1916;--ink:#F2EEE6;--mute:#B8B1A4;--line:rgba(242,238,230,.14);--or2:#FF7A45;--green:#3DBA7E}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--ink)}
body{font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .3s}
.w{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:10px}
.top img{width:36px;height:36px;border-radius:9px}
.top b{font:800 15px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase}
.top span{margin-left:auto;font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.top span.on{color:var(--or2)}
.top span.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--or);margin-right:6px;vertical-align:1px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.k{font:800 12px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{margin:0;font:900 clamp(58px,17vw,96px)/.84 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:-.005em}
h1 em{font-style:normal;color:var(--or2)}
.sous{font:600 18px "Barlow Condensed",sans-serif;color:var(--mute)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:18px 10px 16px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
html.live .score{border-color:var(--or)}
.eq{display:flex;flex-direction:column;gap:2px;font:800 18px/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase}
.eq.d{text-align:right}
.eq small{font:600 12px "Barlow",sans-serif;text-transform:none;color:var(--mute)}
.chif{font:900 clamp(76px,22vw,120px)/.8 "Barlow Condensed",sans-serif;display:flex;gap:10px;align-items:center}
.chif i{font-style:normal;color:var(--mute);font-size:.5em}
.minute{display:flex;justify-content:center}
.minute b{font:900 30px "Barlow Condensed",sans-serif;color:var(--or2)}
.minute b.mt{color:var(--ink)}
.buts{display:flex;flex-direction:column;gap:6px}
.but{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--carte);font:700 17px "Barlow Condensed",sans-serif}
.but span{min-width:38px;color:var(--or2);font-weight:900}
.carte{padding:16px;border-radius:18px;background:var(--carte);display:flex;flex-direction:column;gap:8px}
.carte b{font:800 22px/1.05 "Barlow Condensed",sans-serif}
.carte p{margin:0;font-size:15px;line-height:1.45;color:var(--mute)}
.carte a{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--ink);color:var(--fond);text-decoration:none;font:700 15px "Barlow",sans-serif}
.decompte{font:900 44px/1 "Barlow Condensed",sans-serif}
.decompte em{font-style:normal;color:var(--or2)}
.groupe{display:flex;flex-wrap:wrap;gap:6px}
.groupe span{padding:7px 11px;border-radius:999px;background:var(--fond);font:600 14px "Barlow",sans-serif}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:0;cursor:pointer;font:700 15px "Barlow",sans-serif;background:var(--or);color:#14130F}
.btn.ln{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.pied{font-size:12.5px;color:var(--mute);text-align:center;line-height:1.5}
.vide{padding:22px 16px;border-radius:18px;border:1.5px dashed var(--line);color:var(--mute);font-size:15px;line-height:1.5}
.alerte{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--ink);color:var(--fond)}
.alerte .tx{flex:1;display:flex;flex-direction:column;gap:2px}.alerte b{font:800 18px "Barlow Condensed",sans-serif}.alerte span{font-size:13px;opacity:.8;line-height:1.35}
.alerte button{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--or);color:#14130F;font:700 14px "Barlow",sans-serif;cursor:pointer;white-space:nowrap}
.alerte.ok{background:var(--carte);color:var(--ink)}.alerte.ok b{color:var(--green)}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{transform:scale(1.18);color:var(--or2)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.flash,.top span.on::before{animation:none}}
</style>
</head>
<body>
<div class="w" id="app">
  <div class="top"><img src="icon-192.png" alt="" onerror="this.style.display='none'"><b>AST Tarnos</b><span id="etat">…</span></div>
  <div class="vide">Chargement du match…</div>
</div>
<script>
var URL_DOC='https://firestore.googleapis.com/v1/projects/notes-match-ast/databases/(default)/documents/public/match';
var D=null, AVANT=null, ERREUR=false;
function e(t){ return String(t==null?'':t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dateMatch(s){
  if(!s||!s.jour) return null;
  var p=s.jour.split('-'), d=new Date(+p[0], +p[1]-1, +p[2]);
  var m=/(\d{1,2})h(\d{2})/.exec(s.heure||''); if(m) d.setHours(+m[1], +m[2], 0, 0); else d.setHours(15,0,0,0);
  return d;
}
function minute(L){
  var s=L.base||0; if(L.actif && L.debut) s+=(Date.now()-L.debut)/1000;
  return Math.max(0, Math.floor(s/60))+1;
}
function etatLive(){
  if(!D||!D.live) return null;
  var L=D.live, s=D.s||{};
  if(s.adv && L.adv && L.adv.toLowerCase()!==s.adv.toLowerCase() && !D.fin) return null;
  if(D.fin) return 'fin';
  if(Date.now()-(L.maj||0)>3*3600000) return 'vieux';
  if(L.mt && !L.actif) return 'mt';
  if(L.actif) return 'jeu';
  return (L.base||0)>0?'pause':'avant';
}
function partager(){
  var t='AST Tarnos'+(D&&D.s&&D.s.adv?' vs '+D.s.adv:'')+' : le match en direct';
  if(navigator.share){ navigator.share({title:'AST Tarnos · le match', text:t, url:location.href}).catch(function(){}); return; }
  try{ navigator.clipboard.writeText(location.href).then(function(){ alertCopie(); }); }catch(x){}
}
function alertCopie(){ var b=document.getElementById('bp'); if(b){ b.textContent='Lien copié ✓'; setTimeout(function(){ b.textContent='Partager le lien'; }, 2000); } }
function rendre(){
  var app=document.getElementById('app');
  var top='<div class="top"><img src="icon-192.png" alt="" onerror="this.style.display=\'none\'"><b>AST Tarnos</b>';
  if(!D || !D.s){
    document.documentElement.classList.remove('live');
    app.innerHTML=top+'<span id="etat">'+(ERREUR?'hors ligne':'')+'</span></div>'
      +'<h1>Le match</h1><div class="vide">'+(ERREUR?'Impossible de joindre le club pour l’instant. La page réessaie toute seule.':'Le prochain match apparaîtra ici dès que le staff l’aura annoncé.')+'</div>';
    return;
  }
  var s=D.s, L=D.live, st=etatLive(), dm=dateMatch(s);
  var enDirect=(st==='jeu'||st==='mt'||st==='pause');
  document.documentElement.classList.toggle('live', enDirect);
  var dom=s.dom!==false && !s.ext;
  var nous='<div class="eq'+(dom?'':' d')+'">AST Tarnos<small>'+(dom?'à domicile':'à l’extérieur')+'</small></div>';
  var eux='<div class="eq'+(dom?' d':'')+'">'+e(s.adv)+'<small>'+e(s.comp||'')+'</small></div>';
  var lab={jeu:'En direct', mt:'Mi-temps', pause:'Pause', fin:'Terminé', vieux:'Terminé', avant:'Bientôt'}[st]||'À venir';
  var h=top+'<span id="etat" class="'+(enDirect?'on':'')+'">'+lab+'</span></div>';
  var quand=dm?dm.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'})+(s.heure?' · '+s.heure:''):'';
  if(st && st!=='avant'){
    // le score
    var a=L.nous||0, b=L.eux||0, flash=AVANT && (AVANT[0]!==a || AVANT[1]!==b);
    var gauche=dom?a:b, droite=dom?b:a;
    h+='<div><div class="k">'+e(quand)+'</div></div>'
      +'<div class="score">'+(dom?nous:eux)+'<div class="chif'+(flash?' flash':'')+'"><span>'+gauche+'</span><i>–</i><span>'+droite+'</span></div>'+(dom?eux:nous)+'</div>';
    if(st==='jeu') h+='<div class="minute"><b id="mn">'+minute(L)+'’</b></div>';
    else if(st==='mt') h+='<div class="minute"><b class="mt">Mi-temps</b></div>';
    else if(st==='fin'||st==='vieux') h+='<div class="minute"><b class="mt">'+(a>b?'Victoire':(a<b?'Défaite':'Match nul'))+'</b></div>';
    var B=(L.buts||[]);
    if(B.length) h+='<div class="k">Nos buteurs</div><div class="buts">'+B.map(function(x){ return '<div class="but"><span>'+e(x.m)+'’</span>'+e(x.n||'But')+'</div>'; }).join('')+'</div>';
    if(st==='fin'||st==='vieux') h+='<div class="carte"><b>Merci d’avoir suivi</b><p>Les buts et les temps forts arrivent sur les réseaux du club. À la semaine prochaine.</p></div>';
    AVANT=[a,b];
  } else {
    // avant le match
    var reste=dm?dm-Date.now():0;
    var dec='';
    if(reste>0){
      var j=Math.floor(reste/86400000), hh=Math.floor(reste%86400000/3600000), mn=Math.floor(reste%3600000/60000);
      dec=j>0?('Dans <em>'+j+' jour'+(j>1?'s':'')+'</em>'):(hh>0?'Dans <em>'+hh+' h '+String(mn).padStart(2,'0')+'</em>':'Dans <em>'+mn+' min</em>');
    } else if(dm) dec='<em>Coup d’envoi</em> imminent';
    h+='<div><div class="k">'+e(quand)+'</div><h1>AST <em>vs</em><br>'+e(s.adv)+'</h1><div class="sous">'+(dom?'à domicile':'à l’extérieur')+(s.comp?' · '+e(s.comp):'')+'</div></div>'
      +(dec?'<div class="decompte" id="dec">'+dec+'</div>':'')
      +'<div class="carte"><b>Le score en direct, ici</b><p>Pendant le match, cette page affiche le score, la minute et nos buteurs. Elle se met à jour toute seule : laisse-la ouverte.</p></div>';
    if(s.adresse){
      h+='<div class="carte"><span class="k">Où</span><b>'+e(s.adresse)+'</b><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.adresse)+'" target="_blank" rel="noopener">Y aller</a></div>';
    }
    if((s.groupe||[]).length){
      h+='<div class="carte"><span class="k">Le groupe · '+s.groupe.length+' joueurs</span><div class="groupe">'+s.groupe.map(function(n){ return '<span>'+e(n)+'</span>'; }).join('')+'</div></div>';
    }
  }
  if(st!=='fin' && st!=='vieux') h+=alerteHtml();
  h+='<div class="btns"><button class="btn" id="bp" onclick="partager()">Partager le lien</button></div>'
    +'<div class="pied">Mis à jour depuis le bord du terrain par le staff de l’AST Tarnos.<br>La page se rafraîchit toute seule.</div>';
  app.innerHTML=h;
}
// ---------- « Me prévenir » : coup d'envoi, buts, mi-temps, fin ----------
var VAPID='BIiq0wKfDq0J4LmDlfoo1hmqpW94OKzGaDmKGmWFiVx0gd0zBc6d2Quc_2gZA89Vw4a7Z-V-sSpG3DP36jCNGYY';
var FB_CONF={apiKey:'AIzaSyC2Ip1OWL505ZfXIuvt7UHHy3t7wr6Vq1U', authDomain:'notes-match-ast.firebaseapp.com', projectId:'notes-match-ast', storageBucket:'notes-match-ast.firebasestorage.app', messagingSenderId:'512648656255', appId:'1:512648656255:web:9243b8d6139e9ac82f564a'};
var ABO=null; try{ ABO=localStorage.getItem('ast-proche-abo'); }catch(x){}
function iosSansEcran(){ var ios=/iphone|ipad|ipod/i.test(navigator.userAgent); var app=window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches); return ios && !app; }
function alerteHtml(){
  if(ABO) return '<div class="alerte ok"><span class="tx"><b>✓ Tu seras prévenu</b><span>Coup d’envoi, chaque but, la mi-temps et le score final, sur ce téléphone.</span></span></div>';
  if(!('serviceWorker' in navigator) || !('Notification' in window)){
    if(iosSansEcran()) return '<div class="alerte"><span class="tx"><b>Être prévenu des buts</b><span>Sur iPhone : touche Partager puis « Sur l’écran d’accueil », ouvre la page depuis la nouvelle icône, puis reviens ici.</span></span></div>';
    return '';
  }
  if(Notification.permission==='denied') return '<div class="alerte"><span class="tx"><b>Notifications bloquées</b><span>Ce téléphone les a refusées pour cette page : ça se réactive dans les réglages du navigateur.</span></span></div>';
  return '<div class="alerte"><span class="tx"><b>Être prévenu des buts</b><span>Coup d’envoi, chaque but, la mi-temps et le score final. Sans appli, sans inscription.</span></span><button id="babo" onclick="abonner()">Me prévenir</button></div>';
}
function charger_script(u){ return new Promise(function(ok, ko){ var s=document.createElement('script'); s.src=u; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }
async function abonner(){
  var b=document.getElementById('babo'); if(b){ b.disabled=true; b.textContent='Un instant…'; }
  try{
    var perm=await Notification.requestPermission();
    if(perm!=='granted'){ rendre(); return; }
    await charger_script('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await charger_script('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
    if(!firebase.apps.length) firebase.initializeApp(FB_CONF);
    var reg=await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    var jeton=await firebase.messaging().getToken({vapidKey:VAPID, serviceWorkerRegistration:reg});
    if(!jeton) throw new Error('pas de jeton');
    var r=await fetch('https://firestore.googleapis.com/v1/projects/notes-match-ast/databases/(default)/documents/proches',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields:{token:{stringValue:jeton}, cree:{stringValue:new Date().toISOString()}}})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    ABO='1'; try{ localStorage.setItem('ast-proche-abo','1'); }catch(x){}
  }catch(x){
    if(b){ b.disabled=false; b.textContent='Réessayer'; }
    return;
  }
  rendre();
}
async function charger(){
  try{
    var r=await fetch(URL_DOC, {cache:'no-store'});
    if(r.status===404){ D=null; ERREUR=false; rendre(); return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    var j=await r.json();
    D=JSON.parse(((j.fields||{}).data||{}).stringValue||'null'); ERREUR=false;
  }catch(x){ ERREUR=true; }
  rendre();
}
charger();
setInterval(charger, 20000);
setInterval(function(){
  var m=document.getElementById('mn'); if(m && D && D.live) m.textContent=minute(D.live)+'’';
}, 15000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) charger(); });
</script>
</body>
</html>
