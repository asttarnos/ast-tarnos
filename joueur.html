<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F97316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AST Joueur">
<title>AST Tarnos — Espace Joueur</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--bg2:#161310;--surface:#1d1916;--ink:#f5f2ec;--mute:#9a948d;--or:#F97316;--or-deep:#c2410c;--gold:#eab53f;--green:#3fae6a;--red:#e35b52;--blue:#4ea8de;--purple:#b285e8;--hair:rgba(245,242,236,.08);--gris2:var(--mute);--gris:var(--ink);--line:var(--hair);--blanc:var(--ink);--or2:var(--or-deep);--card:var(--surface)}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{background:radial-gradient(1100px 460px at 50% -8%,rgba(249,115,22,.13),transparent 62%),var(--bg);padding-bottom:24px;min-height:100vh}
.hidden{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px}
.brand-title{font-family:'Anton',sans-serif;letter-spacing:.01em;color:var(--ink);font-size:22px}
.brand-title .accent{color:var(--or)}
.brand-sub{font-size:11.5px;color:var(--mute);margin-top:3px}
/* --- Ecran "qui es-tu" --- */
#scr-login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
#scr-login .crest{display:block}
#scr-login .brand-title{font-size:32px;margin-bottom:2px}
#scr-login .sub{color:var(--mute);font-size:13.5px;margin:22px 0 22px;font-weight:500}
.fi{width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:10px;color:var(--ink);padding:13px 14px;font-size:15px;font-family:inherit}
.fi:focus{outline:none;border-color:var(--or)}
.btn-or{width:100%;background:linear-gradient(160deg,var(--or),var(--or-deep));border:none;color:#fff;font-weight:700;font-size:13.5px;padding:14px;border-radius:10px;margin-top:14px;cursor:pointer;box-shadow:0 6px 20px -6px rgba(249,115,22,.5)}
.btn-or:disabled{opacity:.35;box-shadow:none}
.err-msg{color:var(--red);font-size:12px;margin-top:10px}
.loading-msg{color:var(--mute);font-size:12px;margin-top:10px}
/* --- Header appli --- */
#app-header{position:sticky;top:0;z-index:20;background:rgba(10,9,8,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
#app-header .joueur-nom{font-size:13px;color:var(--ink);font-weight:600}
#app-header .changer{font-size:10px;color:var(--mute);cursor:pointer;margin-top:2px}
/* --- Blocs contenu --- */
.blk{background:linear-gradient(180deg,var(--surface),var(--bg2));border-radius:16px;margin-bottom:14px;overflow:hidden}
.blk-h{padding:15px 16px 2px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.blk-h .t{font-size:14px;font-weight:700;color:var(--ink)}
.blk-h .bc{font-size:10px;color:var(--mute);white-space:nowrap}
.blk-body{padding:10px 16px 16px}
.actu-item{background:rgba(255,255,255,.035);border-radius:10px;padding:12px 13px;font-size:13.5px;line-height:1.45;color:var(--ink)}
.actu-date{font-size:10.5px;color:var(--mute);margin-top:7px}
/* --- Hero convocation --- */
.hero-convoc{background:linear-gradient(160deg,rgba(249,115,22,.16),rgba(249,115,22,.03) 60%);border-radius:16px;margin-bottom:14px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero-convoc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--or),transparent)}
.hero-eyebrow{font-size:11px;color:var(--or);font-weight:600;margin-bottom:6px}
.convoc-adv{font-family:'Anton',sans-serif;font-size:24px;color:var(--ink);line-height:1.05}
.convoc-meta{font-size:12px;color:var(--mute);margin-top:5px}
.statut-badge{display:inline-block;margin-top:12px;padding:6px 13px;border-radius:20px;font-size:11px;font-weight:700}
.statut-a{background:rgba(63,174,106,.16);color:var(--green)}
.statut-b{background:rgba(78,168,222,.16);color:var(--blue)}
.statut-bl{background:rgba(227,91,82,.16);color:var(--red)}
.statut-inconnu{background:rgba(255,255,255,.06);color:var(--mute)}
.plan-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.plan-item:last-child{border-bottom:none}
.plan-date{font-size:11px;color:var(--or);font-weight:700;min-width:70px}
.plan-theme{font-size:13px;color:var(--ink);flex:1;padding-left:10px}
.empty-txt{font-size:12px;color:var(--mute);text-align:center;padding:10px 0}
.soon{text-align:center;padding:70px 24px;color:var(--mute)}
.soon .ic{font-size:36px;margin-bottom:14px;opacity:.7}
.soon .t{font-size:15px;color:var(--ink);font-weight:700;margin-bottom:6px}
.soon .d{font-size:12.5px;line-height:1.5}
/* --- Nav (ancienne barre du bas, remplacée par le hub) --- */
.hub-pole-titre{font-family:'Anton',sans-serif;font-size:19px;letter-spacing:.02em;margin:22px 4px 12px}
.hub-pole-titre:first-child{margin-top:2px}
.hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hub-hero{text-align:center;padding:14px 0 24px}
.hub-crest{width:78px;height:84px;margin:0 auto 12px}
.hub-crest img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(249,115,22,.3))}
.hub-crest-title{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:.01em}
.hub-crest-sub{font-size:12.5px;color:var(--or);font-weight:700;letter-spacing:.08em;margin-top:4px}
.hub-tuile{background:linear-gradient(155deg,var(--surface) 0%,var(--bg2) 100%);border-radius:14px;cursor:pointer;position:relative;overflow:hidden;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center}
.hub-tuile::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.1) 100%);z-index:1}
.hub-tuile::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--tc,var(--or));z-index:2}
.hub-tuile-inner{padding:14px;position:relative;z-index:2}
.hub-tuile .ic{font-size:26px;margin-bottom:8px;opacity:.95}
.hub-tuile .t{font-size:15.5px;font-weight:800;color:var(--ink);line-height:1.2}
.hub-tuile.locked .t::after{content:' 🔒';opacity:.75}
.hub-badge-new{position:absolute;top:10px;right:10px;width:11px;height:11px;border-radius:50%;background:var(--or);box-shadow:0 0 0 3px rgba(249,115,22,.25),0 0 8px rgba(249,115,22,.6);z-index:3}
/* --- Effectif / classement --- */
.podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:6px}
.podium-c{flex:1;background:rgba(255,255,255,.035);border-radius:12px;padding:14px 6px 12px;text-align:center}
.podium-c.p1{background:linear-gradient(160deg,rgba(234,181,63,.18),rgba(234,181,63,.03));order:2;padding-top:8px}
.podium-c.p2{order:1}
.podium-c.p3{order:3}
.podium-rank{font-family:'Anton',sans-serif;font-size:14px;color:var(--mute)}
.podium-med{font-size:24px;margin:5px 0}
.podium-nom{font-size:10.5px;color:var(--ink);font-weight:600;line-height:1.25;min-height:26px}
.podium-pts{font-family:'Anton',sans-serif;font-size:18px;color:var(--gold)}
.podium-lbl{font-size:8px;color:var(--mute)}
.pt-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12px}
.pt-row:last-child{border-bottom:none}
.pt-rank{width:20px;color:var(--mute);font-weight:700;font-size:11px}
.pt-nom{flex:1;color:var(--ink)}
.pt-val{color:var(--gold);font-weight:700;min-width:52px;text-align:right}
.effectif-card{background:rgba(255,255,255,.035);border-radius:14px;padding:13px 14px;margin-bottom:8px}
.effectif-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.effectif-nom{font-size:13px;font-weight:700;color:var(--ink)}
.effectif-note{font-family:'Anton',sans-serif;color:var(--or);font-size:15px}
.effectif-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px}
.effectif-chip{text-align:center}
.effectif-chip .l{font-size:8px;color:var(--mute)}
.effectif-chip .v{font-size:12px;font-weight:700;color:var(--ink);margin-top:1px}
.code-gate{text-align:center;padding:50px 24px}
.code-gate .ic{font-size:32px;margin-bottom:10px}
.obj-bar-bg{background:rgba(255,255,255,.08);border-radius:8px;height:8px;overflow:hidden;margin-top:6px}
.obj-bar-fill{height:100%;background:var(--or);border-radius:8px}
.tableau-saison{width:100%;border-collapse:collapse;font-size:10.5px}
.tableau-saison td{padding:5px 4px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.tableau-saison td:first-child,.tableau-saison td:nth-child(2){text-align:left}
</style>
</head>
<body>

<div id="scr-login">
  <img class="crest" id="login-crest" alt="AST Tarnos" style="width:64px;height:auto;margin:0 auto 16px;display:block;filter:drop-shadow(0 6px 16px rgba(249,115,22,.3))">
  <div class="brand-title">AS<span class="accent">T</span> TARNOS</div>
  <div class="brand-sub">Espace joueur — R2 Poule F</div>
  <div class="sub">Qui es-tu ?</div>
  <select class="fi" id="login-select"><option value="">Chargement de l'effectif...</option></select>
  <button class="btn-or" id="login-btn" disabled onclick="validerLogin()">C'est parti</button>
  <div id="login-err" class="err-msg hidden"></div>
</div>

<div id="app" class="hidden">
  <div id="app-header">
    <div style="display:flex;align-items:center;gap:8px">
      <span onclick="goHub()" style="cursor:pointer;display:flex;align-items:center;gap:4px;padding:10px 12px 10px 8px;margin:-10px 0 -10px -8px;border-radius:8px" title="Retour au menu"><span style="font-size:22px;line-height:1;color:var(--or)">‹</span><span style="font-size:13px;font-weight:700;color:var(--ink)">Menu</span></span>
      <div class="brand-title" style="font-size:15px">AS<span class="accent">T</span></div>
      <span onclick="actualiserDonnees(true)" style="cursor:pointer;font-size:15px;color:var(--mute);padding:8px" title="Actualiser">🔄</span>
    </div>
    <div style="text-align:right">
      <div class="joueur-nom" id="hdr-nom">—</div>
      <div class="changer" onclick="changerJoueur()">changer de joueur</div>
    </div>
  </div>

  <div class="wrap">
    <div id="scr-hub" class="screen"></div>
    <div id="scr-accueil" class="screen hidden"></div>
    <div id="scr-mesmatchs" class="screen hidden"></div>
    <div id="scr-sante" class="screen hidden"></div>
    <div id="scr-questionnaire" class="screen hidden"></div>
    <div id="scr-infosclub" class="screen hidden"></div>
    <div id="scr-calannuel" class="screen hidden"></div>
    <div id="scr-effectif" class="screen hidden"></div>
    <div id="scr-macarte" class="screen hidden"></div>
    <div id="scr-entrainement" class="screen hidden"></div>
    <div id="scr-formephysique" class="screen hidden"></div>
    <div id="scr-saison" class="screen hidden"></div>
    <div id="scr-tempsjeu" class="screen hidden"></div>
    <div id="scr-planning" class="screen hidden"></div>
    <div id="scr-convocations" class="screen hidden"></div>
    <div id="scr-jourmatch" class="screen hidden"></div>
    <div id="scr-prepa" class="screen hidden"></div>
    <div id="scr-statslive" class="screen hidden"></div>
    <div id="scr-seances" class="screen hidden"></div>
    <div id="scr-videos" class="screen hidden"></div>
    <div id="scr-messages" class="screen hidden"></div>
    <div id="scr-coach" class="screen hidden"></div>
  </div>
</div>

var SAISON=null; // données chargées depuis Firestore (saison/main)
var MON_NUM=null, MON_NOM=null;

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

async function chargerSaison(){
  var res=await fetch(FIRESTORE_BASE+'/saison/main');
  if(!res.ok) throw new Error('HTTP '+res.status);
  var doc=await res.json();
  var raw=doc.fields && doc.fields.data ? doc.fields.data.stringValue : null;
  if(!raw) throw new Error('Aucune donnée de saison synchronisée pour le moment');
  SAISON=JSON.parse(raw);
  return SAISON;
}

function init(){
  document.getElementById('login-crest').src=PHOTO_LOGO;
  var savedNum=localStorage.getItem('ast_joueur_num');
  var savedNom=localStorage.getItem('ast_joueur_nom');
  if(savedNum!==null && savedNom){
    MON_NUM=parseInt(savedNum); MON_NOM=savedNom;
    demarrerApp();
  }else{
    initLogin();
  }
}

async function initLogin(){
  var sel=document.getElementById('login-select');
  try{
    await chargerSaison();
    var joueurs=(SAISON.JOUEURS||[]).slice().sort(function(a,b){return (a.nom||'').localeCompare(b.nom||'');});
    if(!joueurs.length){
      sel.innerHTML='<option value="">Aucun joueur trouvé</option>';
      return;
    }
    sel.innerHTML='<option value="">— Sélectionne ton nom —</option>'+joueurs.map(function(j){
      return '<option value="'+j.num+'|'+esc(j.nom)+'">'+esc(j.num)+'. '+esc(j.nom)+'</option>';
    }).join('');
    sel.disabled=false;
    document.getElementById('login-btn').disabled=false;
  }catch(e){
    document.getElementById('login-err').textContent='⚠ Impossible de charger l\'effectif ('+e.message+'). Vérifie ta connexion et réessaie.';
    document.getElementById('login-err').classList.remove('hidden');
    sel.innerHTML='<option value="">Erreur de chargement</option>';
  }
}

function validerLogin(){
  var sel=document.getElementById('login-select');
  var val=sel.value;
  if(!val) return;
  var parts=val.split('|');
  MON_NUM=parseInt(parts[0]); MON_NOM=parts.slice(1).join('|');
  localStorage.setItem('ast_joueur_num',MON_NUM);
  localStorage.setItem('ast_joueur_nom',MON_NOM);
  demarrerApp();
}

function changerJoueur(){
  if(!confirm('Changer de joueur ? Tu devras te resélectionner dans la liste.')) return;
  localStorage.removeItem('ast_joueur_num');
  localStorage.removeItem('ast_joueur_nom');
  location.reload();
}

async function demarrerApp(){
  document.getElementById('scr-login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('hdr-nom').textContent=MON_NOM;
  if(!SAISON){
    try{ await chargerSaison(); }catch(e){
      document.getElementById('scr-hub').innerHTML='<div class="blk"><div class="blk-body"><div class="err-msg">⚠ Impossible de charger les données ('+esc(e.message)+'). Tire vers le bas pour réessayer ou relance l\'appli.</div></div></div>';
      document.getElementById('scr-hub').classList.remove('hidden');
      return;
    }
  }
  renderHub();
  renderAccueil();
  renderMesMatchs();
  renderObjectifs();
  renderSondage();
  renderEffectif();
  renderMaCarte();
  renderPlanning();
  renderConvocations();
  renderSeances();
  renderVideosJoueur();
  renderSaison();
  renderTempsJeu();
  renderSante();
  renderQuestionnaire();
  renderCalendrierAnnuelJoueur();
  renderPrepaAdversaire();
  renderJourDeMatch();
  renderEcranStatsLive();
  renderInfosClub();
  renderFormePhysique();
  renderMessages();
  renderCoach();
  renderPlaceholders();
}

function goHub(){
  document.querySelectorAll('.screen').forEach(function(el){ el.classList.add('hidden'); });
  document.getElementById('scr-hub').classList.remove('hidden');
  window.scrollTo(0,0);
  renderHub();
}
function tuileSignature(key){
  switch(key){
    case 'accueil': return JSON.stringify((SAISON.ACTUALITES||[]).slice(0,5).map(function(a){return a.texte;}));
    case 'mesmatchs':
      var mesNotes=(SAISON.MATCHS||[]).map(function(m){return (m.notes||[]).find(function(n){return n.num===MON_NUM;});}).filter(Boolean).length;
      var conv=SAISON.CONVOS||{};
      return JSON.stringify({n:mesNotes,c:conv.adv,d:conv.date});
    case 'planning': case 'seances': return JSON.stringify(SAISON.PLANNING_MENSUEL||[]);
    case 'convocations': return JSON.stringify((SAISON.CONVOCATIONS_HISTORIQUE||[]).length);
    case 'videos': return JSON.stringify((SAISON.VIDEOS||[]).length);
    case 'calannuel': return JSON.stringify({e:(SAISON.EVENEMENTS_PERSO||[]).length,m:(SAISON.MATCHS||[]).length});
    case 'saison': case 'tempsjeu': case 'effectif': case 'entrainement': return JSON.stringify((SAISON.MATCHS||[]).length);
    case 'sante':
      var idxS=(SAISON.JOUEURS||[]).findIndex(function(j){return j.num===MON_NUM;});
      var b=(SAISON.BLESSURES||[]).find(function(bl){return bl.joueurIdx===idxS;});
      return JSON.stringify(b||null);
    case 'messages': return window._chatSignature||null;
    default: return null;
  }
}
function tuileEstNouvelle(key){
  var sig=tuileSignature(key);
  if(sig===null) return false;
  var vu=localStorage.getItem('ast_vu_'+key);
  if(vu===null){ localStorage.setItem('ast_vu_'+key,sig); return false; } // première visite : pas de pastille, juste on mémorise
  return vu!==sig;
}
function marquerTuileVue(key){
  var sig=tuileSignature(key);
  if(sig!==null) localStorage.setItem('ast_vu_'+key,sig);
}

function parseDateFr(str){
  // format attendu jj/mm/aaaa
  if(!str) return null;
  var m=str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
}

async function chargerMesDisponibilites(){
  try{
    var res=await fetch(FIRESTORE_BASE+'/disponibilites?pageSize=300');
    if(!res.ok) return {};
    var data=await res.json();
    var parCle={};
    (data.documents||[]).forEach(function(doc){
      var f=doc.fields||{};
      var num=f.joueurNum?parseInt(f.joueurNum.integerValue||f.joueurNum.stringValue):null;

async function envoyerVotesCoequipiers(matchKey){

    for(var i=0;i<envois.length;i++){

        matchKey:{stringValue:matchKey},
        voteur:{stringValue:MON_NOM},
        joueurNote:{stringValue:envois[i].nom},

      await fetch(FIRESTORE_BASE+'/votes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

function calcAttrsJoueurDetail(idx){
  var j=SAISON.JOUEURS[idx], s=SAISON.STATS[idx], am=(SAISON.ATTRS_MANUELS||[])[idx]||{tech:7,phys:7,ment:7,gardien:false};
  if(!j||!s) return {attrs:[],note:50};
  var pres=s.seances>0?Math.round(s.pres/s.seances*100):0;
  var engage=Math.min(10,Math.round((s.pts||0)/20));
  var nbMatchs=(SAISON.MATCHS||[]).length;
  var tpsJeu=nbMatchs>0?Math.min(10,Math.round((s.matchsA||0)/nbMatchs*10)):0;
  var disc=Math.max(0,10-((s.cj||0)*2)-((s.cr||0)*5));
  var fiab=Math.min(10,Math.round((s.noteMoy||0)*10/6));
  var presAttr=Math.min(10,Math.round(pres/10));
  var attrs;
  if(am.gardien){
    var csAttr=nbMatchs>0?Math.min(10,Math.round((s.cs||0)/nbMatchs*10)):0;
    var solidite=nbMatchs>0?Math.max(0,10-Math.round((s.butsEnc||0)/nbMatchs*3)):10;
    attrs=[{label:'Présence',val:presAttr},{label:'Engagement',val:engage},{label:'Arrêts (clean sheets)',val:csAttr},{label:'Solidité défensive',val:solidite},{label:'Discipline',val:disc},{label:'Technique',val:parseInt(am.tech)||7},{label:'Physique',val:parseInt(am.phys)||7},{label:'Mental',val:parseInt(am.ment)||7},{label:'Fiabilité (notes)',val:fiab||7}];
  }else{
    var effic=Math.min(10,Math.round(((s.buts||0)+(s.pd||0))/2));
    attrs=[{label:'Présence',val:presAttr},{label:'Engagement',val:engage},{label:'Temps de jeu',val:tpsJeu},{label:'Efficacité',val:effic},{label:'Discipline',val:disc},{label:'Technique',val:parseInt(am.tech)||7},{label:'Physique',val:parseInt(am.phys)||7},{label:'Mental',val:parseInt(am.ment)||7},{label:'Fiabilité (notes)',val:fiab||7}];
  }
  var note=Math.min(99,Math.round(attrs.reduce(function(a,b){return a+b.val;},0)/attrs.length*10));
  return {attrs:attrs,note:note};
}
function calcNoteJoueur(idx){
  return calcAttrsJoueurDetail(idx).note;
}
function calculerBadges(idx){
  var s=SAISON.STATS[idx]||{}, am=(SAISON.ATTRS_MANUELS||[])[idx]||{};
  var badges=[];
  if((s.buts||0)>=5) badges.push({ic:'🎯',lab:'Buteur'});
  if((s.pd||0)>=5) badges.push({ic:'🅰️',lab:'Passeur'});
  if(am.gardien && (s.cs||0)>=3) badges.push({ic:'🛡',lab:'Mur'});
  if(s.seances>0 && (s.pres/s.seances)>=0.9) badges.push({ic:'💯',lab:'Présence exemplaire'});
  if((s.matchsJoues||0)>=5 && (s.cj||0)===0 && (s.cr||0)===0) badges.push({ic:'🟢',lab:'Fair-play'});
  if((s.notesCount||0)>=3 && (s.noteMoy||0)>=5) badges.push({ic:'⭐',lab:'Régulier'});
  if((s.matchsJoues||0)>=8) badges.push({ic:'🔥',lab:'Pilier'});
  var rangPts=(SAISON.JOUEURS||[]).map(function(j,i){return {i:i,pts:(SAISON.STATS[i]||{}).pts||0};}).sort(function(a,b){return b.pts-a.pts;});
  var monRangPts=rangPts.findIndex(function(r){return r.i===idx;})+1;
  if(monRangPts>0 && monRangPts<=3) badges.push({ic:'🏅',lab:'Top '+monRangPts+' entraînement'});
  return badges;
}

function timestampVersSecondes(t){
  var parts=(t||'').split(':').map(function(p){return parseInt(p)||0;});
  if(parts.length===2) return parts[0]*60+parts[1];
  if(parts.length===3) return parts[0]*3600+parts[1]*60+parts[2];
  return 0;
}
function lienAvecTimestamp(url,sec){
  if(!url) return '#';
  var sep=url.indexOf('?')!==-1?'&':'?';
  return url+sep+'t='+sec+'s';
}

function fexNormaliserNom(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function fexNomsCorrespondent(a,b){
  var na=fexNormaliserNom(a).replace(/\s+/g,' '), nb=fexNormaliserNom(b).replace(/\s+/g,' ');
  if(!na||!nb) return false;
  if(na===nb) return true;
  var pa=na.split(' ')[0], pb=nb.split(' ')[0];
  return na.indexOf(nb)!==-1 || nb.indexOf(na)!==-1 || (pa.length>=4 && pb.length>=4 && pa===pb);
}

function renderCalendrierMensuel(){
  var cal=SAISON.CALENDRIER||[];
  if(!cal.length) return '<div class="empty-txt">Calendrier non synchronisé pour l\'instant</div>';
  var matchsR2=(SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).slice().reverse();
  var utilises=matchsR2.map(function(){return false;});
  var vusCal={};
  return '<table class="tableau-saison"><tr style="color:var(--gris2)"><td>J</td><td>Adversaire</td><td>Lieu</td><td>Score</td></tr>'
    +cal.filter(function(f){return f.comp==='R2';}).map(function(f,idx){
      var k=fexNormaliserNom(f.adversaire);
      vusCal[k]=(vusCal[k]||0)+1;
      var occ=vusCal[k],compteur=0,mt=null,mi=-1;
      for(var i=0;i<matchsR2.length;i++){
        if(utilises[i]) continue;
        if(fexNormaliserNom(matchsR2[i].adversaire)===k){ compteur++; if(compteur===occ){ mt=matchsR2[i]; mi=i; break; } }
      }
      if(mt) utilises[mi]=true;
      return '<tr'+(mt?'':' style="opacity:.45"')+'><td style="color:var(--or);font-weight:700">J'+(idx+1)+'</td><td>'+esc(f.adversaire)+'</td><td>'+(f.lieu==='D'?'🏠':'✈')+'</td><td>'+(mt?(mt.ast+'-'+mt.adv+' '+mt.res):'—')+'</td></tr>';
    }).join('')+'</table>';
}

      +'<div><span style="color:'+resCol+';font-weight:700">'+m.ast+'-'+m.adv+'</span></div></div>';
  }).join('');
}
function calculerClassementAuto(){
  var stats={},NOM_CLUB=SAISON.NOM_CLUB||'AST Tarnos';
  function ligne(nom){ if(!stats[nom]) stats[nom]={equipe:nom,j:0,v:0,n:0,d:0,bp:0,bc:0,pts:0}; return stats[nom]; }
  function appliquer(a,b,sa,sb){
    var la=ligne(a),lb=ligne(b);
    la.j++; lb.j++; la.bp+=sa; la.bc+=sb; lb.bp+=sb; lb.bc+=sa;
    if(sa>sb){la.v++;la.pts+=3;lb.d++;} else if(sa<sb){lb.v++;lb.pts+=3;la.d++;} else {la.n++;lb.n++;la.pts+=1;lb.pts+=1;}
  }
  (SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).forEach(function(m){ appliquer(NOM_CLUB,m.adversaire,m.ast,m.adv); });
  (SAISON.AUTRES_RESULTATS||[]).forEach(function(r){ appliquer(r.eq1,r.eq2,r.s1,r.s2); });
  return Object.keys(stats).map(function(k){return stats[k];}).sort(function(a,b){ return (b.pts-a.pts)||((b.bp-b.bc)-(a.bp-a.bc))||(b.bp-a.bp); });
}
function calculerClassementParLieu(filtreLieu){
  var stats={},NOM_CLUB=SAISON.NOM_CLUB||'AST Tarnos';
  function ligne(nom){ if(!stats[nom]) stats[nom]={equipe:nom,j:0,v:0,n:0,d:0,bp:0,bc:0,pts:0}; return stats[nom]; }
  function crediter(nom,sp,sc){ var l=ligne(nom); l.j++; l.bp+=sp; l.bc+=sc; if(sp>sc){l.v++;l.pts+=3;} else if(sp<sc){l.d++;} else {l.n++;l.pts+=1;} }
  (SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).forEach(function(m){
    var estDom=m.lieu==='D';
    if(filtreLieu==='D'&&estDom) crediter(NOM_CLUB,m.ast,m.adv);
    if(filtreLieu==='E'&&!estDom) crediter(NOM_CLUB,m.ast,m.adv);
  });
  (SAISON.AUTRES_RESULTATS||[]).forEach(function(r){
    if(filtreLieu==='D') crediter(r.eq1,r.s1,r.s2);
    if(filtreLieu==='E') crediter(r.eq2,r.s2,r.s1);
  });
  return Object.keys(stats).map(function(k){return stats[k];}).sort(function(a,b){ return (b.pts-a.pts)||((b.bp-b.bc)-(a.bp-a.bc))||(b.bp-a.bp); });
}
function tableClassement(sorted){
  var NOM_CLUB=SAISON.NOM_CLUB||'AST Tarnos';
  if(!sorted.length) return '<div class="empty-txt">Aucun résultat pour l\'instant</div>';
  return sorted.map(function(e,rang){
    var isTarnos=e.equipe===NOM_CLUB;
    return '<div class="pt-row"'+(isTarnos?' style="color:var(--or);font-weight:700"':'')+'><div class="pt-rank">'+(rang+1)+'</div><div class="pt-nom">'+esc(e.equipe)+'</div><div style="font-size:10px;color:var(--gris2);margin-right:8px">'+e.bp+'-'+e.bc+'</div><div class="pt-val">'+e.pts+' pts</div></div>';
  }).join('');
}
function calculerBilanCategorise(){
  var r2=(SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).slice().reverse();
  var vus={};
  var cats={aller:{J:0,V:0,N:0,D:0,BP:0,BC:0},retour:{J:0,V:0,N:0,D:0,BP:0,BC:0},dom:{J:0,V:0,N:0,D:0,BP:0,BC:0},ext:{J:0,V:0,N:0,D:0,BP:0,BC:0}};
  function acc(cat,m){ cat.J++; cat.BP+=(m.ast||0); cat.BC+=(m.adv||0); if(m.res==='V')cat.V++; else if(m.res==='N')cat.N++; else cat.D++; }
  r2.forEach(function(m){
    var clef=fexNormaliserNom(m.adversaire);
    vus[clef]=(vus[clef]||0)+1;
    var phase=vus[clef]<=1?'aller':'retour';
    acc(cats[phase],m);
    acc(m.lieu==='D'?cats.dom:cats.ext,m);
  });
  return cats;
}
function renderBilanHtml(){
  var cats=calculerBilanCategorise();
  var defs=[{k:'aller',lab:'🔵 Phase aller'},{k:'retour',lab:'🟠 Phase retour'},{k:'dom',lab:'🏠 Domicile'},{k:'ext',lab:'✈ Extérieur'}];
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+defs.map(function(d){
    var c=cats[d.k],diff=c.BP-c.BC;
    return '<div style="background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:6px;padding:8px 10px">'
      +'<div style="font-size:10.5px;font-weight:700;margin-bottom:6px">'+d.lab+' <span style="color:var(--gris2);font-weight:400">('+c.J+' j.)</span></div>'
      +'<div style="font-size:10px;color:var(--gris2)">V<b style="color:var(--green)"> '+c.V+'</b> N<b style="color:var(--gold)"> '+c.N+'</b> D<b style="color:var(--red)"> '+c.D+'</b></div>'
      +'<div style="font-size:10px;color:var(--gris2);margin-top:2px">'+c.BP+'-'+c.BC+' <span style="color:'+(diff>0?'var(--green)':diff<0?'var(--red)':'var(--gris2)')+'">('+(diff>0?'+':'')+diff+')</span></div></div>';

}

function renderTempsJeu(){
  var ct=document.getElementById('scr-tempsjeu');
  if(!ct) return;
  var joueurs=SAISON.JOUEURS||[],stats=SAISON.STATS||[];
  var configs=[
    {k:'temps_total',titre:'⏱ Temps total cumulé',unit:'min',get:function(s){return s.tpsTotal||0;}},
    {k:'temps_moy',titre:'📊 Temps moyen par match',unit:'min/match',get:function(s){return s.tpsMoy||0;}},
    {k:'titu',titre:'🟢 Titularisations',unit:'fois',get:function(s){return s.titu||0;}},
    {k:'rempl',titre:'🔵 Entrées en jeu (banc)',unit:'fois',get:function(s){return s.rempl||0;}},
    {k:'matchs',titre:'⚽ Matchs joués',unit:'matchs',get:function(s){return s.matchsJoues||0;}},
    {k:'equite',titre:'⚖ Écart à la moyenne d\'équipe',unit:'min',get:function(s){return s.tpsTotal||0;}}
  ];
  ct.innerHTML=configs.map(function(cfg){
    var data=joueurs.map(function(j,i){return {j:j,v:cfg.get(stats[i]||{}),actif:((stats[i]||{}).matchsJoues||0)>0};});
    var actifs=data.filter(function(d){return d.actif;});
    var moyenne=actifs.length?Math.round(actifs.reduce(function(s,d){return s+d.v;},0)/actifs.length):0;
    var estEquite=cfg.k==='equite';
    if(estEquite) data.sort(function(a,b){return a.v-b.v;});
    else data.sort(function(a,b){return b.v-a.v;});
    var max=Math.max.apply(null,data.map(function(d){return d.v;}).concat([1]));
    var explication=estEquite?'<div style="font-size:10.5px;color:var(--mute);margin-bottom:10px">Compare le temps de jeu total de chaque joueur à la moyenne de l\'effectif ('+moyenne+' min). <span style="color:var(--red)">Rouge</span> = largement en dessous, <span style="color:var(--green)">vert</span> = dans la moyenne, <span style="color:var(--gold)">or</span> = largement au-dessus.</div>':'';
    var liste=data.map(function(d){
      var pct=max>0?Math.round(d.v/max*100):0;
      var col='var(--or)',estMoi=d.j.num===MON_NUM;
      if(estEquite){
        var ecart=d.v-moyenne;
        col=ecart<-moyenne*0.4?'var(--red)':ecart>moyenne*0.4?'var(--gold)':'var(--green)';
      }
      var label=estEquite?(d.v+' min ('+(d.v>=moyenne?'+':'')+(d.v-moyenne)+')'):(d.v+' '+cfg.unit);
      return '<div style="margin-bottom:9px">'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:700;color:'+(estMoi?'var(--or)':'var(--ink)')+'">'+esc(d.j.nom)+(estMoi?' (toi)':'')+'</span><span style="color:'+col+';font-weight:700">'+label+'</span></div>'
        +'<div style="height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:4px"></div></div>'
        +'</div>';
    }).join('');
    return '<div class="blk"><div class="blk-h"><span class="t">'+cfg.titre+'</span></div><div class="blk-body">'+explication+liste+'</div></div>';
  }).join('');
}

var MOIS_FR_NOMS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
var MOIS_FR_IDX={'janvier':0,'fevrier':1,'mars':2,'avril':3,'mai':4,'juin':5,'juillet':6,'aout':7,'septembre':8,'octobre':9,'novembre':10,'decembre':11};
function normaliserAccents(t){ return (t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function parserDateCalendrierMatch(dateStr){
  var m=(dateStr||'').match(/(\d{1,2})\s+(\S+)\s+(\d{4})/);
  if(!m) return null;
  var jour=parseInt(m[1]), moisNom=normaliserAccents(m[2]), annee=parseInt(m[3]);
  var mois=MOIS_FR_IDX[moisNom];
  if(mois===undefined) return null;
  return {y:annee,m:mois,d:jour};
}
function dateIso(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
var CA_ICONES={competition:'🏆','coupe-landes':'🏆','coupe-aquitaine':'🏆',amical:'🤝',entrainement:'🏋️'};
var CA_COULEURS={competition:'rgba(249,115,22,.18)','coupe-landes':'rgba(249,115,22,.18)','coupe-aquitaine':'rgba(249,115,22,.18)',amical:'rgba(249,115,22,.10)',entrainement:'rgba(63,174,106,.18)'};

var CAJ_ANNEE=null, CAJ_MOIS=null;
function caEvenementsDuJourJoueur(y,m,d){
  var evts=[];
  (SAISON.EVENEMENTS_PERSO||[]).forEach(function(e){
    var iso=dateIso(y,m,d);
    if(e.date===iso && CA_ICONES[e.type]) evts.push({type:e.type,texte:e.texte});
  });
  (SAISON.CALENDRIER||[]).forEach(function(c){
    var pd=parserDateCalendrierMatch(c.date);
    if(pd && pd.y===y && pd.m===m && pd.d===d) evts.push({type:'competition',texte:'vs '+c.adversaire});
  });
  return evts;
}

function statsLiveDocId(matchKey,num){
  return (matchKey+'_'+num).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,140);
}
function statsLiveMatchKeyActuel(){
  var conv=SAISON.CONVOS||{};
  return (conv.date||'')+'|'+(conv.adv||'');
}
async function chargerCompteursStatsLive(num){
  var matchKey=statsLiveMatchKeyActuel();
  var docId=statsLiveDocId(matchKey,num);
  try{
    var res=await fetch(FIRESTORE_BASE+'/stats_live/'+docId);
    if(!res.ok) return {};
    var doc=await res.json();
    var f=doc.fields||{};
    var out={};
    TYPES_STATS_LIVE.forEach(function(t){ out[t.k]=f[t.k]?parseInt(f[t.k].integerValue||f[t.k].stringValue)||0:0; });
    return out;
  }catch(e){ return {}; }
}
async function sauvegarderCompteursStatsLive(){
  if(!STATSLIVE_JOUEUR) return;
  var matchKey=statsLiveMatchKeyActuel();
  var docId=statsLiveDocId(matchKey,STATSLIVE_JOUEUR.num);
  var fields={
    matchKey:{stringValue:matchKey},
    joueurNum:{integerValue:String(STATSLIVE_JOUEUR.num)},
    joueurNom:{stringValue:STATSLIVE_JOUEUR.nom},
    saisiPar:{stringValue:MON_NOM},
    dateMaj:{stringValue:new Date().toISOString()}
  };
  TYPES_STATS_LIVE.forEach(function(t){ fields[t.k]={integerValue:String(STATSLIVE_COMPTEURS[t.k]||0)}; });
  try{
    await fetch(FIRESTORE_BASE+'/stats_live/'+docId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:fields})});
  }catch(e){ /* si ça échoue, le compteur reste correct localement, on retentera au prochain tap */ }
}
function statsLiveIncrementer(cle,delta){
  STATSLIVE_COMPTEURS[cle]=Math.max(0,(STATSLIVE_COMPTEURS[cle]||0)+delta);

function cajChangerMois(delta){

  var det=document.getElementById('caj-jour-detail-blk'); if(det) det.style.display='none';
  cajRenderGrille();
}
function cajRenderGrille(){
  document.getElementById('caj-mois-titre').textContent=MOIS_FR_NOMS[CAJ_MOIS]+' '+CAJ_ANNEE;
  var premierJour=new Date(CAJ_ANNEE,CAJ_MOIS,1).getDay();
  var decalage=premierJour===0?6:premierJour-1;
  var nbJours=new Date(CAJ_ANNEE,CAJ_MOIS+1,0).getDate();
  var aujourdhui=new Date();
  var html='';
  ['L','M','M','J','V','S','D'].forEach(function(j){ html+='<div style="text-align:center;font-size:9px;color:var(--mute);font-weight:700;padding-bottom:2px">'+j+'</div>'; });
  for(var i=0;i<decalage;i++) html+='<div></div>';
  for(var d=1;d<=nbJours;d++){
    var evts=caEvenementsDuJourJoueur(CAJ_ANNEE,CAJ_MOIS,d);
    var estAujourdhui=(CAJ_ANNEE===aujourdhui.getFullYear()&&CAJ_MOIS===aujourdhui.getMonth()&&d===aujourdhui.getDate());
    var fond=evts.length?CA_COULEURS[evts[0].type]:'rgba(255,255,255,.03)';
    var bord=estAujourdhui?'var(--or)':(evts.length?CA_BORDS[evts[0].type]:'var(--hair)');
    html+='<div onclick="cajOuvrirJour('+CAJ_ANNEE+','+CAJ_MOIS+','+d+')" style="cursor:pointer;min-height:44px;padding:3px;border-radius:5px;border:'+(estAujourdhui?'2px':'1px')+' solid '+bord+';background:'+fond+'">'
      +'<div style="font-size:10px;font-weight:'+(estAujourdhui?'800':'600')+';color:'+(estAujourdhui?'var(--or)':'var(--ink)')+'">'+d+'</div>'
      +(evts.length?'<div style="font-size:11px">'+(CA_ICONES[evts[0].type]||'•')+(evts.length>1?' +'+(evts.length-1):'')+'</div>':'')
      +'</div>';
  }
  document.getElementById('caj-grille').innerHTML=html;
}

  document.getElementById('caj-jour-liste').innerHTML=evts.length?evts.map(function(e){

    +'<label class="fl">Zone concernée</label><select class="fi" id="sante-zone" style="margin:6px 0 12px">'+ZONES_SANTE.map(function(z){return '<option value="'+(z.indexOf('—')===0?'':z)+'">'+z+'</option>';}).join('')+'</select>'

    +'<div class="struct-chip" onclick="choisirTypeSante(\'autre\',this)">Autre</div></div>'
    +'<label class="fl">Date</label><input class="fi" id="sante-date" placeholder="jj/mm/aaaa" style="margin:6px 0 12px">'
    +'<label class="fl">Description (facultatif)</label><textarea class="fi" id="sante-desc" rows="2" style="margin:6px 0 14px;resize:vertical" placeholder="Ex: douleur au mollet depuis la séance de mardi"></textarea>'
    +'<button class="btn-or" onclick="declarerBlessure()" style="margin-top:0">Envoyer au coach</button>'

      return '<div style="padding:8px 0;border-bottom:1px solid var(--hair);font-size:12px"><b style="color:var(--ink)">'+esc(d.zone)+'</b><span style="color:var(--mute)"> — '+esc(d.dateBlessure)+'</span>'

function renderCoach(){

      +'<input class="fi" id="coach-code" type="password" placeholder="Code d\'accès" style="max-width:200px;margin:0 auto 10px;text-align:center">'

    +(blessures.length?blessures.map(function(b){
      var j=(SAISON.JOUEURS||[])[b.joueurIdx]||{};
      return '<div style="background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:6px">'
        +'<b style="color:#fff;font-size:12px">'+esc(j.nom||'?')+'</b><span style="color:var(--gris2);font-size:10.5px"> — '+esc(b.zone||'')+(b.nature?' · '+esc(b.nature):'')+'</span>'
        +'<div style="font-size:10px;color:var(--gris2);margin-top:3px">Depuis le '+esc(b.dateBlessure||'—')+(b.retourEstime?' — retour estimé '+esc(b.retourEstime):'')+'</div></div>';
    }).join(''):'<div class="empty-txt">Aucune blessure en cours 🎉</div>')
    +'</div></div>'
    +'<div style="padding:0 4px"><span style="font-size:10px;color:var(--gris2);text-decoration:underline;cursor:pointer" onclick="verrouillerCoach()">🔒 Reverrouiller cet espace</span></div>';
}
function verifierCodeCoach(){
  var val=(document.getElementById('coach-code').value||'').trim().toUpperCase();
  if(val==='AST'){
    COACH_DEVERROUILLE=true;
    localStorage.setItem('ast_coach_ok','1');
    renderCoach();
  }else{
    var e=document.getElementById('coach-code-err');
    e.textContent='Code incorrect';
    e.classList.remove('hidden');
  }
}
function verrouillerCoach(){
  COACH_DEVERROUILLE=false;
  localStorage.removeItem('ast_coach_ok');
  renderCoach();
}

// ===== Objectifs & sondages (ajoutés sur l'Accueil) =====
async function envoyerPropositionObjectifs(){
  var choix=[];
  [0,1,2].forEach(function(n){
    var sel=document.getElementById('propobj-type-'+n);
    var cibleInput=document.getElementById('propobj-cible-'+n);
    if(sel.value && cibleInput.value){
      choix.push({type:sel.value,cible:parseFloat(cibleInput.value)});
    }
  });
  if(!choix.length){ notif('⚠ Choisis au moins un objectif avec une cible'); return; }
  var body={fields:{
    joueur:{stringValue:MON_NOM},
    choix:{stringValue:JSON.stringify(choix)},
    dateAffiche:{stringValue:new Date().toLocaleDateString('fr-FR')},
    message:{stringValue:document.getElementById('propobj-message').value.trim()}
  }};
  try{
    await fetch(FIRESTORE_BASE+'/objectifs_individuels_demandes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    document.getElementById('propobj-statut').textContent='✓ Envoyé au coach le '+new Date().toLocaleDateString('fr-FR');
    notif('✓ Proposition envoyée');
  }catch(e){
    notif('⚠ Envoi impossible — vérifie ta connexion');
  }
}
function renderObjectifs(){
  var ct=document.getElementById('scr-mesmatchs');
  if(!ct) return;
  var idx=(SAISON.JOUEURS||[]).findIndex(function(j){return j.num===MON_NUM;});
  var mesObjectifs=idx!==-1?((SAISON.OBJECTIFS||[])[idx]||[]):[];
  var html='<div class="blk"><div class="blk-h"><span class="t">🎯 Mes objectifs</span></div><div class="blk-body">';
  html+=mesObjectifs.length?mesObjectifs.map(function(o){
    return '<div style="margin-bottom:10px"><div style="font-size:12px;color:#fff">'+esc(o.label||'')+'</div><div style="font-size:10px;color:var(--gris2)">Cible : '+esc(o.cible)+'</div></div>';
  }).join(''):'<div class="empty-txt">Aucun objectif défini pour l\'instant</div>';
  html+='</div></div>';

  var OBJ_TYPES=[
    {id:'pres_pct',cat:'Présence & entraînement',label:'% présence entraînements',unit:'%',def:70},
    {id:'pts_entrainement',cat:'Présence & entraînement',label:'Points entraînement',unit:'pts',def:100},
    {id:'pct_matchs_a',cat:'Temps de jeu',label:'Matchs joués en Équipe A',unit:'matchs',def:10},
    {id:'titu',cat:'Temps de jeu',label:'Titularisations',unit:'fois',def:10},
    {id:'tps_total',cat:'Temps de jeu',label:'Minutes jouées total',unit:'min',def:500},
    {id:'buts',cat:'Performance',label:'Buts marqués',unit:'buts',def:5},
    {id:'passes_d',cat:'Performance',label:'Passes décisives',unit:'PD',def:3},
    {id:'ga',cat:'Performance',label:'G+A combinés',unit:'G+A',def:8},
    {id:'note_moy',cat:'Performance',label:'Note moyenne /10',unit:'/10',def:7},
    {id:'clean_sheets',cat:'Gardien',label:'Clean sheets (GK)',unit:'CS',def:5},
    {id:'zero_amende',cat:'Discipline',label:'0 amende sur la saison',unit:'€',def:0},
    {id:'cj_max',cat:'Discipline',label:'Max cartons jaunes',unit:'CJ',def:2}
  ];
  html+='<div class="blk"><div class="blk-h"><span class="t">✍️ Proposer mes objectifs</span></div><div class="blk-body">'
    +'<div style="font-size:10.5px;color:var(--mute);margin-bottom:12px">Choisis jusqu\'à 3 objectifs pour la saison — le coach valide et les applique à ta fiche.</div>'
    +[0,1,2].map(function(n){
      return '<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--hair)">'
        +'<label class="fl">Objectif '+(n+1)+'</label>'
        +'<select class="fi" id="propobj-type-'+n+'" style="margin:6px 0 6px" onchange="document.getElementById(\'propobj-cible-'+n+'\').value=this.options[this.selectedIndex].dataset.def||\'\'">'
        +'<option value="">— Aucun —</option>'
        +OBJ_TYPES.map(function(t){return '<option value="'+t.id+'" data-label="'+esc(t.label)+'" data-unit="'+esc(t.unit)+'" data-def="'+t.def+'">'+esc(t.cat)+' — '+esc(t.label)+'</option>';}).join('')
        +'</select>'
        +'<input class="fi ninput" type="number" id="propobj-cible-'+n+'" placeholder="Cible chiffrée" style="width:100%">'
        +'</div>';
    }).join('')
    +'<label class="fl">Message pour le coach (facultatif)</label><textarea class="fi" id="propobj-message" rows="2" style="margin:6px 0 12px;resize:vertical" placeholder="Pourquoi ces objectifs ?"></textarea>'
    +'<button class="btn-or" onclick="envoyerPropositionObjectifs()">Envoyer au coach</button>'
    +'<div id="propobj-statut" style="font-size:10px;color:var(--mute);margin-top:8px"></div>'
    +'</div></div>';
  html+='<div class="blk"><div class="blk-h"><span class="t">🤝 Objectifs collectifs</span></div><div class="blk-body">';
  var objColl=SAISON.OBJ_COLL||[];
  html+=objColl.length?objColl.map(function(o){
    var pct=o.cible>0?Math.min(100,Math.round((o.actuel||0)/o.cible*100)):0;
    return '<div style="margin-bottom:10px"><div style="font-size:12px;color:#fff">'+(o.icon||'🎯')+' '+esc(o.label||'')+'</div>'
      +'<div style="font-size:10px;color:var(--gris2)">'+(o.actuel||0)+' / '+o.cible+' '+esc(o.unit||'')+'</div>'
      +'<div class="obj-bar-bg"><div class="obj-bar-fill" style="width:'+pct+'%"></div></div></div>';
  }).join(''):'<div class="empty-txt">Aucun objectif collectif pour l\'instant</div>';
  html+='</div></div>';
  ct.insertAdjacentHTML('beforeend',html);
}
async function chargerMesReponsesSondages(){
  try{
    var res=await fetch(FIRESTORE_BASE+'/sondage_reponses?pageSize=300');
    if(!res.ok) return {};
    var data=await res.json();
    var parSondage={};
    (data.documents||[]).forEach(function(doc){
      var f=doc.fields||{};
      if((f.joueur||{}).stringValue!==MON_NOM) return;
      parSondage[(f.sondageId||{}).stringValue]=(f.reponse||{}).stringValue||'';
    });
    return parSondage;
  }catch(e){ return {}; }
}
async function repondreSondage(sondageId,reponse){
  var body={fields:{
    sondageId:{stringValue:sondageId},
    joueur:{stringValue:MON_NOM},
    reponse:{stringValue:reponse},
    dateReponse:{stringValue:new Date().toISOString()}
  }};
  try{
    await fetch(FIRESTORE_BASE+'/sondage_reponses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    notif('✓ Réponse envoyée');
    renderSondage();
  }catch(e){
    notif('⚠ Envoi impossible — vérifie ta connexion');
  }
}
async function renderSondage(){
  var ct=document.getElementById('scr-accueil');
  if(!ct) return;
  var sondages=(SAISON.SONDAGES||[]).filter(function(s){return s.actif;});
  var mesReponses=sondages.length?await chargerMesReponsesSondages():{};
  var html='<div class="blk"><div class="blk-h"><span class="t">📊 Sondage en cours</span></div><div class="blk-body">';
  html+=sondages.length?sondages.map(function(s){
    var maReponse=mesReponses[s.id];
    return '<div style="margin-bottom:14px"><div style="font-size:12.5px;color:#fff;margin-bottom:8px;font-weight:600">'+esc(s.question||'')+'</div>'
      +(s.options||[]).map(function(o){
        var texte=typeof o==='string'?o:(o.texte||'');
        var estChoisi=maReponse===texte;
        return '<div onclick="'+(maReponse?'':'repondreSondage(\''+String(s.id).replace(/'/g,"\\'")+'\',\''+texte.replace(/'/g,"\\'")+'\')')+'" style="font-size:12px;padding:9px 12px;border-radius:8px;margin-bottom:5px;cursor:'+(maReponse?'default':'pointer')+';background:'+(estChoisi?'rgba(249,115,22,.18)':'rgba(255,255,255,.035)')+';border:1px solid '+(estChoisi?'var(--or)':'transparent')+';color:'+(estChoisi?'var(--or)':'var(--ink)')+';font-weight:'+(estChoisi?'700':'400')+'">'+(estChoisi?'✓ ':'')+esc(texte)+'</div>';
      }).join('')
      +(maReponse?'':'<div style="font-size:10px;color:var(--mute);margin-top:2px">Choisis une réponse</div>')
      +'</div>';
  }).join(''):'<div class="empty-txt">Aucun sondage en cours</div>';
  html+='</div></div>';
  ct.insertAdjacentHTML('beforeend',html);
}
