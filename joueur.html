<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F97316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AST Joueur">
<title>AST Tarnos — Espace Joueur</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0d0f;--bg2:#101113;--surface:#15171b;--ink:#e8e9eb;--mute:#8b909a;--or:#d97706;--or-deep:#8a5615;--gold:#e0a530;--green:#22a06b;--red:#dc4444;--blue:#4ea8de;--purple:#b285e8;--hair:#24262b;--gris2:var(--mute);--gris:var(--ink);--line:var(--hair);--blanc:var(--ink);--or2:var(--or-deep);--card:var(--surface)}
html,body{min-height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{background:var(--bg);padding-bottom:24px;min-height:100vh}
.hidden{display:none!important}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px}
.brand-title{font-family:Roboto Condensed,sans-serif;font-weight:700;letter-spacing:.01em;color:var(--ink);font-size:20px}
.brand-title .accent{color:var(--or)}
.brand-sub{font-size:13px;color:var(--mute);margin-top:3px}
/* --- Ecran "qui es-tu" --- */
#scr-login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
#scr-login .crest{display:block}
#scr-login .brand-title{font-size:26px;margin-bottom:2px}
#scr-login .sub{color:var(--mute);font-size:14.5px;margin:20px 0 20px;font-weight:500}
.fi{width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:5px;color:var(--ink);padding:11px 13px;font-size:14px;font-family:inherit}
.fi:focus{outline:none;border-color:var(--or)}
.btn-or{width:100%;background:var(--or);border:none;color:#1a0f02;font-weight:700;font-family:'Roboto Condensed',sans-serif;letter-spacing:.02em;text-transform:uppercase;font-size:14.5px;padding:13px;border-radius:5px;margin-top:14px;cursor:pointer}
.btn-or:disabled{opacity:.35}
.err-msg{color:var(--red);font-size:14px;margin-top:10px}
.loading-msg{color:var(--mute);font-size:14px;margin-top:10px}
/* --- Header appli --- */
#app-header{position:sticky;top:0;z-index:20;background:rgba(12,13,15,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);padding:11px 14px;padding-top:calc(11px + env(safe-area-inset-top,44px));display:flex;align-items:center;justify-content:space-between}
#app-header .joueur-nom{font-size:14.5px;color:var(--ink);font-weight:600}
#app-header .changer{font-size:12px;color:var(--mute);cursor:pointer;margin-top:2px}
/* --- Blocs contenu --- */
.blk{background:var(--surface);border:1px solid var(--hair);border-radius:12px;margin-bottom:14px;overflow:hidden}
.blk-h{padding:9px 12px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:10px}
.blk-h .t{font-family:'Roboto Condensed',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.blk-h .bc{font-size:12px;color:var(--mute);white-space:nowrap}
.blk-body{padding:12px}
.actu-item{background:rgba(255,255,255,.03);border-radius:5px;padding:11px 12px;font-size:14.5px;line-height:1.45;color:var(--ink)}
.actu-date{font-size:12px;color:var(--mute);margin-top:7px}
/* --- Hero convocation --- */
.hero-convoc{background:linear-gradient(160deg,rgba(217,119,6,.18),rgba(217,119,6,.02) 65%);border:1px solid rgba(217,119,6,.3);border-radius:14px;margin-bottom:14px;padding:18px;position:relative;overflow:hidden;box-shadow:0 8px 24px -12px rgba(217,119,6,.25)}
.hero-eyebrow{font-family:'Roboto Condensed',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--or);margin-bottom:8px}
.convoc-adv{font-family:Roboto Condensed,sans-serif;font-weight:700;font-size:20px;color:var(--ink);line-height:1.1}
.convoc-meta{font-size:13.5px;color:var(--mute);margin-top:5px}
.statut-badge{display:inline-block;margin-top:12px;padding:5px 11px;border-radius:4px;font-size:12.5px;font-weight:700}
.statut-a{background:rgba(34,160,107,.14);color:var(--green)}
.statut-b{background:rgba(78,168,222,.14);color:var(--blue)}
.statut-bl{background:rgba(220,68,68,.14);color:var(--red)}
.statut-inconnu{background:rgba(255,255,255,.05);color:var(--mute)}
.plan-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.plan-item:last-child{border-bottom:none}
.plan-date{font-family:'Roboto Condensed',sans-serif;font-size:12.5px;color:var(--or);font-weight:700;min-width:70px}
.plan-theme{font-size:14.5px;color:var(--ink);flex:1;padding-left:10px}
.empty-txt{font-size:13.5px;color:var(--mute);text-align:center;padding:10px 0}
.soon{text-align:center;padding:70px 24px;color:var(--mute)}
.soon .ic{font-size:32px;margin-bottom:14px;opacity:.6}
.soon .t{font-family:'Roboto Condensed',sans-serif;font-size:14px;color:var(--ink);font-weight:700;margin-bottom:6px}
.soon .d{font-size:14px;line-height:1.5}
/* --- Hub : menu liste, style pro --- */
.hub-hero{padding:16px 4px 18px;border-bottom:1px solid var(--hair);margin-bottom:6px;display:flex;align-items:center;gap:13px;background:radial-gradient(120px 60px at 30px 20px,rgba(217,119,6,.14),transparent 70%)}
.hub-crest{width:42px;height:45px;flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(217,119,6,.3))}
.hub-crest img{width:100%;height:100%;object-fit:contain}
.hub-crest-title{font-family:'Roboto Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.hub-crest-sub{font-size:12.5px;color:var(--or);font-weight:600;letter-spacing:.04em;margin-top:2px;text-transform:uppercase}
.hub-pole-titre{font-family:'Roboto Condensed',sans-serif;font-size:16.5px;font-weight:700;letter-spacing:.02em;color:var(--ink);margin:18px 4px 6px;padding-top:4px}
.hub-pole-titre:first-child{margin-top:2px}
.hub-grid{display:block;border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.hub-tuile{background:var(--surface);cursor:pointer;position:relative;display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--hair);background-image:none!important;transition:background .15s}
.hub-tuile:active{background:rgba(255,255,255,.04)}
.hub-tuile:last-child{border-bottom:none}
.hub-tuile::after,.hub-tuile::before{display:none!important}
.hub-tuile .ic{font-size:18px;width:32px;height:32px;line-height:32px;text-align:center;flex-shrink:0;background:color-mix(in srgb,var(--tc) 18%,transparent);border-radius:9px}
.hub-tuile-inner{display:flex;align-items:center;gap:11px;padding:0;flex:1;min-width:0}
.hub-tuile .t{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.2;flex:1}
.hub-tuile.locked .t::after{content:' · verrouillé';color:var(--mute);font-weight:400;font-size:13px}
.hub-tuile-inner::after{content:'\203A';color:var(--mute);font-size:16px;margin-left:auto;flex-shrink:0}
.hub-badge-new{position:static;width:7px;height:7px;border-radius:50%;background:var(--or);box-shadow:none;margin-left:8px;flex-shrink:0}
.hub-badge-attente{position:static;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:none;margin-left:8px;flex-shrink:0}
/* --- Effectif / classement --- */
.podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:6px}
.podium-c{flex:1;background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:5px;padding:14px 6px 12px;text-align:center}
.podium-c.p1{border-color:rgba(224,165,48,.4);order:2;padding-top:8px}
.podium-c.p2{order:1}
.podium-c.p3{order:3}
.podium-rank{font-family:'Roboto Condensed',sans-serif;font-size:14.5px;color:var(--mute)}
.podium-med{font-size:20px;margin:5px 0}
.podium-nom{font-size:12px;color:var(--ink);font-weight:600;line-height:1.25;min-height:26px}
.podium-pts{font-family:'Roboto Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--gold)}
.podium-lbl{font-size:10px;color:var(--mute)}
.pt-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.pt-row:last-child{border-bottom:none}
.pt-rank{width:20px;color:var(--mute);font-weight:700;font-size:12.5px;font-family:'Roboto Condensed',sans-serif}
.pt-nom{flex:1;color:var(--ink)}
.pt-val{color:var(--gold);font-weight:700;font-family:'Roboto Condensed',sans-serif;min-width:52px;text-align:right}
.effectif-card{background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:6px;padding:12px 13px;margin-bottom:8px}
.effectif-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.effectif-nom{font-size:14.5px;font-weight:600;color:var(--ink)}
.effectif-note{font-family:Roboto Condensed,sans-serif;font-weight:700;color:var(--or);font-size:14px}
.effectif-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px}
.effectif-chip{text-align:center}
.effectif-chip .l{font-size:10px;color:var(--mute);text-transform:uppercase}
.effectif-chip .v{font-family:'Roboto Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--ink);margin-top:1px}
.code-gate{text-align:center;padding:50px 24px}
.code-gate .ic{font-size:28px;margin-bottom:10px;opacity:.7}
.obj-bar-bg{background:var(--hair);border-radius:3px;height:5px;overflow:hidden;margin-top:6px}
.obj-bar-fill{height:100%;background:var(--or);border-radius:3px}
.tableau-saison{width:100%;border-collapse:collapse;font-size:12px}
.tableau-saison td{padding:5px 4px;border-top:1px solid var(--hair);text-align:center;white-space:nowrap;font-family:'Roboto Condensed',sans-serif}
.tableau-saison td:first-child,.tableau-saison td:nth-child(2){text-align:left;font-family:'Inter',sans-serif}
.onb-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;padding:0}
.onb-skip{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;font-size:12px;color:var(--mute);cursor:pointer;z-index:2}
.onb-slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 28px}
.onb-slide .ic{font-size:52px;margin-bottom:22px}
.onb-slide h2{font-family:'Roboto Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--ink);margin-bottom:12px}
.onb-slide p{font-size:14px;color:var(--mute);line-height:1.6;max-width:320px}
.onb-slide .demo{margin-top:22px}
.onb-dots{display:flex;gap:7px;justify-content:center;padding-bottom:18px}
.onb-dot{width:7px;height:7px;border-radius:50%;background:var(--hair)}
.onb-dot.on{background:var(--or);width:20px;border-radius:4px;transition:width .2s}
.onb-nav{display:flex;gap:10px;padding:16px 24px calc(24px + env(safe-area-inset-bottom,0px))}
.onb-nav .btn-or{margin-top:0}
</style>
</head>
<body>

<div id="scr-login">
  <img class="crest" id="login-crest" alt="AST Tarnos" style="width:64px;height:auto;margin:0 auto 16px;display:block;filter:drop-shadow(0 6px 16px rgba(249,115,22,.3))">
  <div class="brand-title">AS<span class="accent">T</span> TARNOS</div>
  <div class="brand-sub">Espace joueur — R2 Poule F</div>
  <div class="sub">Qui es-tu ?</div>
  <select class="fi" id="login-select"><option value="">Chargement de l'effectif...</option></select>
  <button class="btn-or" id="login-btn" disabled onclick="validerLogin()">C'est parti</button>
  <div id="login-err" class="err-msg hidden"></div>
</div>

<div id="app" class="hidden">
  <div id="onb-overlay" class="onb-overlay hidden">
    <div class="onb-skip" onclick="fermerOnboarding()">Passer</div>
    <div class="onb-slide" id="onb-slide-content"></div>
    <div class="onb-dots" id="onb-dots"></div>
    <div class="onb-nav">
      <button class="btn-or" id="onb-btn-next" onclick="onbSuivant()">Suivant</button>
    </div>
  </div>
  <div id="app-header">
    <div style="display:flex;align-items:center;gap:8px">
      <span onclick="goHub()" style="cursor:pointer;display:flex;align-items:center;gap:4px;padding:10px 12px 10px 8px;margin:-10px 0 -10px -8px;border-radius:8px" title="Retour au menu"><span style="font-size:22px;line-height:1;color:var(--or)">‹</span><span style="font-size:14.5px;font-weight:700;color:var(--ink)">Menu</span></span>
      <div class="brand-title" style="font-size:16.5px">AS<span class="accent">T</span></div>
      <span onclick="actualiserDonnees(true)" style="cursor:pointer;font-size:16.5px;color:var(--mute);padding:8px" title="Actualiser">🔄</span>
    </div>
    <div style="text-align:right">
      <div class="joueur-nom" id="hdr-nom">—</div>
      <div class="changer" onclick="changerJoueur()">changer de joueur</div>
    </div>
  </div>

  <div class="wrap">
    <div id="scr-hub" class="screen"></div>
    <div id="scr-accueil" class="screen hidden"></div>
    <div id="scr-mesmatchs" class="screen hidden"></div>
    <div id="scr-sante" class="screen hidden"></div>
    <div id="scr-infosclub" class="screen hidden"></div>
    <div id="scr-calannuel" class="screen hidden"></div>
    <div id="scr-effectif" class="screen hidden"></div>
    <div id="scr-macarte" class="screen hidden"></div>
    <div id="scr-entrainement" class="screen hidden"></div>
    <div id="scr-formephysique" class="screen hidden"></div>
    <div id="scr-saison" class="screen hidden"></div>
    <div id="scr-tempsjeu" class="screen hidden"></div>
    <div id="scr-planning" class="screen hidden"></div>
    <div id="scr-convocations" class="screen hidden"></div>
    <div id="scr-jourmatch" class="screen hidden"></div>
    <div id="scr-prepa" class="screen hidden"></div>
    <div id="scr-statslive" class="screen hidden"></div>
    <div id="scr-seances" class="screen hidden"></div>
    <div id="scr-videos" class="screen hidden"></div>
    <div id="scr-messages" class="screen hidden"></div>
    <div id="scr-coach" class="screen hidden"></div>
  </div>
</div>

var SAISON=null; // données chargées depuis Firestore (saison/main)
var MON_NUM=null, MON_NOM=null;

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

async function chargerSaison(){
  var res=await fetch(FIRESTORE_BASE+'/saison/main');
  if(!res.ok) throw new Error('HTTP '+res.status);
  var doc=await res.json();
  var raw=doc.fields && doc.fields.data ? doc.fields.data.stringValue : null;
  if(!raw) throw new Error('Aucune donnée de saison synchronisée pour le moment');
  SAISON=JSON.parse(raw);
  return SAISON;
}

function init(){
  document.getElementById('login-crest').src=PHOTO_LOGO;
  var savedNum=localStorage.getItem('ast_joueur_num');
  var savedNom=localStorage.getItem('ast_joueur_nom');
  if(savedNum!==null && savedNom){
    MON_NUM=parseInt(savedNum); MON_NOM=savedNom;
    demarrerApp();
  }else{
    initLogin();
  }
}

async function initLogin(){
  var sel=document.getElementById('login-select');
  try{
    await chargerSaison();
    var joueurs=(SAISON.JOUEURS||[]).slice().sort(function(a,b){return (a.nom||'').localeCompare(b.nom||'');});
    if(!joueurs.length){
      sel.innerHTML='<option value="">Aucun joueur trouvé</option>';
      return;
    }
    sel.innerHTML='<option value="">— Sélectionne ton nom —</option>'+joueurs.map(function(j){
      return '<option value="'+j.num+'|'+esc(j.nom)+'">'+esc(j.num)+'. '+esc(j.nom)+'</option>';
    }).join('');
    sel.disabled=false;
    document.getElementById('login-btn').disabled=false;
  }catch(e){
    document.getElementById('login-err').textContent='⚠ Impossible de charger l\'effectif ('+e.message+'). Vérifie ta connexion et réessaie.';
    document.getElementById('login-err').classList.remove('hidden');
    sel.innerHTML='<option value="">Erreur de chargement</option>';
  }
}

function validerLogin(){
  var sel=document.getElementById('login-select');
  var val=sel.value;
  if(!val) return;
  var parts=val.split('|');
  MON_NUM=parseInt(parts[0]); MON_NOM=parts.slice(1).join('|');
  localStorage.setItem('ast_joueur_num',MON_NUM);
  localStorage.setItem('ast_joueur_nom',MON_NOM);
  demarrerApp();
}

function changerJoueur(){
  if(!confirm('Changer de joueur ? Tu devras te resélectionner dans la liste.')) return;
  localStorage.removeItem('ast_joueur_num');
  localStorage.removeItem('ast_joueur_nom');
  location.reload();
}

function demarrerOnboardingSiPremiereFois(){
  var vu=localStorage.getItem('ast_onboarding_'+MON_NUM);

  ONB_INDEX=0;
  document.getElementById('onb-overlay').classList.remove('hidden');
  onbRenderSlide();
}
function onbRenderSlide(){
  var s=ONB_SLIDES[ONB_INDEX];
  document.getElementById('onb-slide-content').innerHTML='<div class="ic">'+s.ic+'</div><h2>'+esc(s.titre)+'</h2><p>'+esc(s.texte)+'</p>';
  document.getElementById('onb-dots').innerHTML=ONB_SLIDES.map(function(_,i){ return '<div class="onb-dot'+(i===ONB_INDEX?' on':'')+'"></div>'; }).join('');
  document.getElementById('onb-btn-next').textContent=(ONB_INDEX===ONB_SLIDES.length-1)?"C'est parti":'Suivant';
}
function onbSuivant(){
  if(ONB_INDEX<ONB_SLIDES.length-1){ ONB_INDEX++; onbRenderSlide(); }
  else{ fermerOnboarding(); }
}
function fermerOnboarding(){
  localStorage.setItem('ast_onboarding_'+MON_NUM,'1');
  document.getElementById('onb-overlay').classList.add('hidden');
}

}
function tuileSignature(key){
  switch(key){
    case 'accueil': return JSON.stringify((SAISON.ACTUALITES||[]).slice(0,5).map(function(a){return a.texte;}));
    case 'mesmatchs':
      var mesNotes=(SAISON.MATCHS||[]).map(function(m){return (m.notes||[]).find(function(n){return n.num===MON_NUM;});}).filter(Boolean).length;
      var conv=SAISON.CONVOS||{};
      return JSON.stringify({n:mesNotes,c:conv.adv,d:conv.date});
    case 'planning': case 'seances': return JSON.stringify(SAISON.PLANNING_MENSUEL||[]);
    case 'convocations': return JSON.stringify((SAISON.CONVOCATIONS_HISTORIQUE||[]).length);
    case 'videos': return JSON.stringify((SAISON.VIDEOS||[]).length);
    case 'calannuel': return JSON.stringify({e:(SAISON.EVENEMENTS_PERSO||[]).length,m:(SAISON.MATCHS||[]).length});
    case 'saison': case 'tempsjeu': case 'effectif': case 'entrainement': return JSON.stringify((SAISON.MATCHS||[]).length);
    case 'sante':
      var idxS=(SAISON.JOUEURS||[]).findIndex(function(j){return j.num===MON_NUM;});
      var b=(SAISON.BLESSURES||[]).find(function(bl){return bl.joueurIdx===idxS;});
      return JSON.stringify(b||null);
    case 'messages': return window._chatSignature||null;
    case 'infosclub':
      var ic=SAISON.INFOS_CLUB||{};
      return JSON.stringify({r:ic.reglement,c:(ic.contacts||[]).length});
    case 'jourmatch':
      var convJM=SAISON.CONVOS||{};
      var fm=SAISON.FEUILLE_MATCH||{};
      return JSON.stringify({adv:convJM.adv,date:convJM.date,off:fm.consignesOff,def:fm.consignesDef,indiv:(fm.consignesIndiv||{})[MON_NOM]});
    case 'prepa':
      var convP=SAISON.CONVOS||{};
      var advFiche=(SAISON.ADVERSAIRES||[]).find(function(a){ return fexNomsCorrespondent(a.nom,convP.adv||''); });
      return JSON.stringify({adv:convP.adv,fiches:(advFiche&&advFiche.fiches)?advFiche.fiches.length:0});
    case 'macarte':
      var idxM=(SAISON.JOUEURS||[]).findIndex(function(j){return j.num===MON_NUM;});
      return JSON.stringify(((SAISON.NOTE_HISTORIQUE||[])[idxM]||[]).length);
    case 'coach':
      return JSON.stringify({b:(SAISON.BLESSURES||[]).length});
    default: return null;
  }
}
async function calculerActionsEnAttente(){
  window._actionsEnAttente=window._actionsEnAttente||{};
  // Sondage en attente de réponse ?
  try{
    var sondages=(SAISON.SONDAGES||[]).filter(function(s){return s.actif;});
    if(sondages.length){
      var mesReponses=await chargerMesReponsesSondages();
      window._actionsEnAttente.accueil=sondages.some(function(s){return !mesReponses[s.id];});
    }else{
      window._actionsEnAttente.accueil=false;
    }
  }catch(e){ window._actionsEnAttente.accueil=false; }
  // Disponibilité en attente de réponse ?
  try{
    var evts=prochainsEvenementsDispo();
    if(evts.length){

function parseDateFr(str){
  // format attendu jj/mm/aaaa
  if(!str) return null;
  var m=str.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(parseInt(m[3]),parseInt(m[2])-1,parseInt(m[1]));
}

async function chargerMesDisponibilites(){
  try{
    var res=await fetch(FIRESTORE_BASE+'/disponibilites?pageSize=300');
    if(!res.ok) return {};
    var data=await res.json();
    var parCle={};
    (data.documents||[]).forEach(function(doc){
      var f=doc.fields||{};
      var num=f.joueurNum?parseInt(f.joueurNum.integerValue||f.joueurNum.stringValue):null;
      if(num!==MON_NUM) return;
      var cle=(f.evenementCle||{}).stringValue||'';
      parCle[cle]=(f.reponse||{}).stringValue||'';
    });
    return parCle;
  }catch(e){ return {}; }
}
async function envoyerDisponibilite(cle,label,reponse){
  var body={fields:{
    joueurNum:{integerValue:String(MON_NUM)},
    joueurNom:{stringValue:MON_NOM},
    evenementCle:{stringValue:cle},
    evenementLabel:{stringValue:label},
    reponse:{stringValue:reponse},
    dateReponse:{stringValue:new Date().toISOString()}
  }};
  try{
    await fetch(FIRESTORE_BASE+'/disponibilites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    notif(reponse==='dispo'?'✓ Marqué disponible':'✓ Marqué indisponible');
    renderMesMatchs();
  }catch(e){
    notif('⚠ Envoi impossible — vérifie ta connexion');
  }
}
function prochainsEvenementsDispo(){
  var evts=[];
  var conv=SAISON.CONVOS||{};
  if(conv.adv){
    evts.push({cle:(conv.date||'')+'|'+conv.adv,label:'Match vs '+conv.adv+(conv.date?' — '+conv.date:'')});
  }
  var planning=(SAISON.PLANNING_MENSUEL||[]).map(function(p){ return {raw:p, d:parseDateFr(p.date)}; })
    .filter(function(x){ return x.d && x.d>=new Date(new Date().setHours(0,0,0,0)); })
    .sort(function(a,b){ return a.d-b.d; })
    .slice(0,2);
  planning.forEach(function(x){
    evts.push({cle:'seance|'+x.raw.date,label:'Séance du '+x.raw.date+(x.raw.theme?' — '+x.raw.theme:'')});
  });
  return evts;

async function chargerMaConfirmation(matchKey){

function calcAttrsJoueurDetail(idx){
  var j=SAISON.JOUEURS[idx], s=SAISON.STATS[idx], am=(SAISON.ATTRS_MANUELS||[])[idx]||{tech:7,phys:7,ment:7,gardien:false};
  if(!j||!s) return {attrs:[],note:50};
  var pres=s.seances>0?Math.round(s.pres/s.seances*100):0;
  var engage=Math.min(10,Math.round((s.pts||0)/20));
  var nbMatchs=(SAISON.MATCHS||[]).length;
  var tpsJeu=nbMatchs>0?Math.min(10,Math.round((s.matchsA||0)/nbMatchs*10)):0;
  var disc=Math.max(0,10-((s.cj||0)*2)-((s.cr||0)*5));
  var fiab=Math.min(10,Math.round((s.noteMoy||0)*10/6));
  var presAttr=Math.min(10,Math.round(pres/10));
  var attrs;
  if(am.gardien){
    var csAttr=nbMatchs>0?Math.min(10,Math.round((s.cs||0)/nbMatchs*10)):0;
    var solidite=nbMatchs>0?Math.max(0,10-Math.round((s.butsEnc||0)/nbMatchs*3)):10;
    attrs=[{label:'Présence',val:presAttr},{label:'Engagement',val:engage},{label:'Arrêts (clean sheets)',val:csAttr},{label:'Solidité défensive',val:solidite},{label:'Discipline',val:disc},{label:'Technique',val:parseInt(am.tech)||7},{label:'Physique',val:parseInt(am.phys)||7},{label:'Mental',val:parseInt(am.ment)||7},{label:'Fiabilité (notes)',val:fiab||7}];
  }else{
    var effic=Math.min(10,Math.round(((s.buts||0)+(s.pd||0))/2));
    attrs=[{label:'Présence',val:presAttr},{label:'Engagement',val:engage},{label:'Temps de jeu',val:tpsJeu},{label:'Efficacité',val:effic},{label:'Discipline',val:disc},{label:'Technique',val:parseInt(am.tech)||7},{label:'Physique',val:parseInt(am.phys)||7},{label:'Mental',val:parseInt(am.ment)||7},{label:'Fiabilité (notes)',val:fiab||7}];
  }
  var note=Math.min(99,Math.round(attrs.reduce(function(a,b){return a+b.val;},0)/attrs.length*10));
  return {attrs:attrs,note:note};
}
function calcNoteJoueur(idx){
  return calcAttrsJoueurDetail(idx).note;
}
function calculerBadges(idx){
  var s=SAISON.STATS[idx]||{}, am=(SAISON.ATTRS_MANUELS||[])[idx]||{};
  var badges=[];
  if((s.buts||0)>=5) badges.push({ic:'🎯',lab:'Buteur'});
  if((s.pd||0)>=5) badges.push({ic:'🅰️',lab:'Passeur'});
  if(am.gardien && (s.cs||0)>=3) badges.push({ic:'🛡',lab:'Mur'});
  if(s.seances>0 && (s.pres/s.seances)>=0.9) badges.push({ic:'💯',lab:'Présence exemplaire'});
  if((s.matchsJoues||0)>=5 && (s.cj||0)===0 && (s.cr||0)===0) badges.push({ic:'🟢',lab:'Fair-play'});
  if((s.notesCount||0)>=3 && (s.noteMoy||0)>=5) badges.push({ic:'⭐',lab:'Régulier'});
  if((s.matchsJoues||0)>=8) badges.push({ic:'🔥',lab:'Pilier'});
  var rangPts=(SAISON.JOUEURS||[]).map(function(j,i){return {i:i,pts:(SAISON.STATS[i]||{}).pts||0};}).sort(function(a,b){return b.pts-a.pts;});
  var monRangPts=rangPts.findIndex(function(r){return r.i===idx;})+1;
  if(monRangPts>0 && monRangPts<=3) badges.push({ic:'🏅',lab:'Top '+monRangPts+' entraînement'});
  return badges;
}

function timestampVersSecondes(t){
  var parts=(t||'').split(':').map(function(p){return parseInt(p)||0;});
  if(parts.length===2) return parts[0]*60+parts[1];
  if(parts.length===3) return parts[0]*3600+parts[1]*60+parts[2];
  return 0;
}
function lienAvecTimestamp(url,sec){
  if(!url) return '#';
  var sep=url.indexOf('?')!==-1?'&':'?';
  return url+sep+'t='+sec+'s';
}

function fexNormaliserNom(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function fexNomsCorrespondent(a,b){
  var na=fexNormaliserNom(a).replace(/\s+/g,' '), nb=fexNormaliserNom(b).replace(/\s+/g,' ');
  if(!na||!nb) return false;
  if(na===nb) return true;
  var pa=na.split(' ')[0], pb=nb.split(' ')[0];
  return na.indexOf(nb)!==-1 || nb.indexOf(na)!==-1 || (pa.length>=4 && pb.length>=4 && pa===pb);
}

function calculerClassementAuto(){
  var stats={},NOM_CLUB=SAISON.NOM_CLUB||'AST Tarnos';
  function ligne(nom){ if(!stats[nom]) stats[nom]={equipe:nom,j:0,v:0,n:0,d:0,bp:0,bc:0,pts:0}; return stats[nom]; }
  function appliquer(a,b,sa,sb){
    var la=ligne(a),lb=ligne(b);
    la.j++; lb.j++; la.bp+=sa; la.bc+=sb; lb.bp+=sb; lb.bc+=sa;
    if(sa>sb){la.v++;la.pts+=3;lb.d++;} else if(sa<sb){lb.v++;lb.pts+=3;la.d++;} else {la.n++;lb.n++;la.pts+=1;lb.pts+=1;}
  }
  (SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).forEach(function(m){ appliquer(NOM_CLUB,m.adversaire,m.ast,m.adv); });
  (SAISON.AUTRES_RESULTATS||[]).forEach(function(r){ appliquer(r.eq1,r.eq2,r.s1,r.s2); });
  return Object.keys(stats).map(function(k){return stats[k];}).sort(function(a,b){ return (b.pts-a.pts)||((b.bp-b.bc)-(a.bp-a.bc))||(b.bp-a.bp); });
}
function calculerClassementParLieu(filtreLieu){
  var stats={},NOM_CLUB=SAISON.NOM_CLUB||'AST Tarnos';
  function ligne(nom){ if(!stats[nom]) stats[nom]={equipe:nom,j:0,v:0,n:0,d:0,bp:0,bc:0,pts:0}; return stats[nom]; }
  function crediter(nom,sp,sc){ var l=ligne(nom); l.j++; l.bp+=sp; l.bc+=sc; if(sp>sc){l.v++;l.pts+=3;} else if(sp<sc){l.d++;} else {l.n++;l.pts+=1;} }
  (SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).forEach(function(m){
    var estDom=m.lieu==='D';
    if(filtreLieu==='D'&&estDom) crediter(NOM_CLUB,m.ast,m.adv);
    if(filtreLieu==='E'&&!estDom) crediter(NOM_CLUB,m.ast,m.adv);
  });
  (SAISON.AUTRES_RESULTATS||[]).forEach(function(r){
    if(filtreLieu==='D') crediter(r.eq1,r.s1,r.s2);
    if(filtreLieu==='E') crediter(r.eq2,r.s2,r.s1);
  });
  return Object.keys(stats).map(function(k){return stats[k];}).sort(function(a,b){ return (b.pts-a.pts)||((b.bp-b.bc)-(a.bp-a.bc))||(b.bp-a.bp); });
}

  var NOM_CLUB=SAISON.NOM_CLUB||'AST Tarnos';
  if(!sorted.length) return '<div class="empty-txt">Aucun résultat pour l\'instant</div>';

  }).join('');
}
function calculerBilanCategorise(){
  var r2=(SAISON.MATCHS||[]).filter(function(m){return m.comp==='R2';}).slice().reverse();
  var vus={};
  var cats={aller:{J:0,V:0,N:0,D:0,BP:0,BC:0},retour:{J:0,V:0,N:0,D:0,BP:0,BC:0},dom:{J:0,V:0,N:0,D:0,BP:0,BC:0},ext:{J:0,V:0,N:0,D:0,BP:0,BC:0}};
  function acc(cat,m){ cat.J++; cat.BP+=(m.ast||0); cat.BC+=(m.adv||0); if(m.res==='V')cat.V++; else if(m.res==='N')cat.N++; else cat.D++; }
  r2.forEach(function(m){
    var clef=fexNormaliserNom(m.adversaire);
    vus[clef]=(vus[clef]||0)+1;
    var phase=vus[clef]<=1?'aller':'retour';
    acc(cats[phase],m);
    acc(m.lieu==='D'?cats.dom:cats.ext,m);
  });
  return cats;
}

    {k:'equite',titre:'⚖ Écart à la moyenne d\'équipe',unit:'min',get:function(s){return s.tpsTotal||0;}}
  ];
  ct.innerHTML=configs.map(function(cfg){
    var data=joueurs.map(function(j,i){return {j:j,v:cfg.get(stats[i]||{}),actif:((stats[i]||{}).matchsJoues||0)>0};});
    var actifs=data.filter(function(d){return d.actif;});
    var moyenne=actifs.length?Math.round(actifs.reduce(function(s,d){return s+d.v;},0)/actifs.length):0;
    var estEquite=cfg.k==='equite';
    if(estEquite) data.sort(function(a,b){return a.v-b.v;});
    else data.sort(function(a,b){return b.v-a.v;});
    var max=Math.max.apply(null,data.map(function(d){return d.v;}).concat([1]));
    var explication=estEquite?'<div style="font-size:12.5px;color:var(--mute);margin-bottom:10px">Compare le temps de jeu total de chaque joueur à la moyenne de l\'effectif ('+moyenne+' min). <span style="color:var(--red)">Rouge</span> = largement en dessous, <span style="color:var(--green)">vert</span> = dans la moyenne, <span style="color:var(--gold)">or</span> = largement au-dessus.</div>':'';
    var liste=data.map(function(d){
      var pct=max>0?Math.round(d.v/max*100):0;
      var col='var(--or)',estMoi=d.j.num===MON_NUM;
      if(estEquite){
        var ecart=d.v-moyenne;
        col=ecart<-moyenne*0.4?'var(--red)':ecart>moyenne*0.4?'var(--gold)':'var(--green)';
      }
      var label=estEquite?(d.v+' min ('+(d.v>=moyenne?'+':'')+(d.v-moyenne)+')'):(d.v+' '+cfg.unit);
      return '<div style="margin-bottom:9px">'
        +'<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:3px"><span style="font-weight:700;color:'+(estMoi?'var(--or)':'var(--ink)')+'">'+esc(d.j.nom)+(estMoi?' (toi)':'')+'</span><span style="color:'+col+';font-weight:700">'+label+'</span></div>'
        +'<div style="height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:4px"></div></div>'
        +'</div>';
    }).join('');
    return '<div class="blk"><div class="blk-h"><span class="t">'+cfg.titre+'</span></div><div class="blk-body">'+explication+liste+'</div></div>';
  }).join('');
}

var MOIS_FR_IDX={'janvier':0,'fevrier':1,'mars':2,'avril':3,'mai':4,'juin':5,'juillet':6,'aout':7,'septembre':8,'octobre':9,'novembre':10,'decembre':11};
function normaliserAccents(t){ return (t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function parserDateCalendrierMatch(dateStr){
  var m=(dateStr||'').match(/(\d{1,2})\s+(\S+)\s+(\d{4})/);
  if(!m) return null;
  var jour=parseInt(m[1]), moisNom=normaliserAccents(m[2]), annee=parseInt(m[3]);
  var mois=MOIS_FR_IDX[moisNom];
  if(mois===undefined) return null;
  return {y:annee,m:mois,d:jour};
}
function dateIso(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }

function caEvenementsDuJourJoueur(y,m,d){
  var evts=[];
  (SAISON.EVENEMENTS_PERSO||[]).forEach(function(e){
    var iso=dateIso(y,m,d);
    if(e.date===iso && CA_ICONES[e.type]) evts.push({type:e.type,texte:e.texte});
  });
  (SAISON.CALENDRIER||[]).forEach(function(c){
    var pd=parserDateCalendrierMatch(c.date);

  return evts;

  if(!ct) return;
  var conv=SAISON.CONVOS||{};
  if(!conv.adv){
    ct.innerHTML='<div class="blk"><div class="blk-body"><div class="empty-txt">Aucun match en préparation pour le moment</div></div></div>';
    return;
  }
  var matchDejaJoue=(SAISON.MATCHS||[]).some(function(m){ return fexNomsCorrespondent(m.adversaire,conv.adv); });
  var lieuTxt=conv.lieu==='D'?'Domicile':conv.lieu==='E'?'Extérieur':(conv.lieu||'');
  var lienMaps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((conv.lieuTexte||conv.adv||'')+' stade');
  var lienMeteo='https://www.google.com/search?q='+encodeURIComponent('météo '+(conv.lieuTexte||'')+' '+(conv.date||''));
  var html='<div class="hero-convoc">';
  html+='<div class="hero-eyebrow">📱 Jour de match'+(matchDejaJoue?' (terminé)':'')+'</div>';
  html+='<div class="convoc-adv">vs '+esc(conv.adv)+'</div>';
  html+='<div class="convoc-meta">'+esc(conv.date||'Date à confirmer')+' — '+esc(lieuTxt)+'</div>';
  var nomsA=(conv.a||[]).map(function(n){return (n||'').toLowerCase().trim();});
  var nomsB=(conv.b||[]).map(function(n){return (n||'').toLowerCase().trim();});
  var monNomLc=(MON_NOM||'').toLowerCase().trim();
  if(nomsA.indexOf(monNomLc)!==-1) html+='<div class="statut-badge statut-a">✓ Convoqué — Équipe A</div>';
  else if(nomsB.indexOf(monNomLc)!==-1) html+='<div class="statut-badge statut-b">✓ Convoqué — Équipe B</div>';
  else html+='<div class="statut-badge statut-inconnu">Pas encore annoncé</div>';
  html+='</div>';

  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">'
    +'<a href="'+lienMaps+'" target="_blank" style="text-decoration:none;background:rgba(255,255,255,.035);border-radius:12px;padding:16px 10px;text-align:center"><div style="font-size:22px;margin-bottom:4px">📍</div><div style="font-size:13.5px;color:var(--ink);font-weight:700">Itinéraire</div></a>'
    +'<a href="'+lienMeteo+'" target="_blank" style="text-decoration:none;background:rgba(255,255,255,.035);border-radius:12px;padding:16px 10px;text-align:center"><div style="font-size:22px;margin-bottom:4px">🌤️</div><div style="font-size:13.5px;color:var(--ink);font-weight:700">Météo</div></a>'
    +'</div>';

  var feuille=SAISON.FEUILLE_MATCH||{};
  var consignesPerso=feuille.consignesIndiv?feuille.consignesIndiv[MON_NOM]:'';
  if(feuille.consignesOff||feuille.consignesDef||consignesPerso){
    html+='<div class="blk"><div class="blk-h"><span class="t">📝 Consignes du coach</span></div><div class="blk-body">';
    if(consignesPerso) html+='<div style="margin-bottom:10px"><div style="font-size:11px;color:var(--or);font-weight:700">POUR TOI</div><div style="font-size:14.5px;color:var(--ink)">'+esc(consignesPerso)+'</div></div>';
    if(feuille.consignesOff) html+='<div style="margin-bottom:10px"><div style="font-size:11px;color:var(--mute)">EN POSSESSION</div><div style="font-size:14.5px;color:var(--ink)">'+esc(feuille.consignesOff)+'</div></div>';
    if(feuille.consignesDef) html+='<div><div style="font-size:11px;color:var(--mute)">À LA PERTE</div><div style="font-size:14.5px;color:var(--ink)">'+esc(feuille.consignesDef)+'</div></div>';
    html+='</div></div>';
  }

  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
    +'<div onclick="goNav(\'prepa\')" style="cursor:pointer;background:rgba(255,255,255,.035);border-radius:12px;padding:14px;text-align:center"><div style="font-size:18px;margin-bottom:4px">🎯</div><div style="font-size:13px;color:var(--ink);font-weight:700">Prépa adversaire</div></div>'
    +'<div onclick="goNav(\'coach\')" style="cursor:pointer;background:rgba(255,255,255,.035);border-radius:12px;padding:14px;text-align:center"><div style="font-size:18px;margin-bottom:4px">🎨</div><div style="font-size:13px;color:var(--ink);font-weight:700">Plateau tactique</div></div>'
    +'</div>';

  ct.innerHTML=html;
}
function renderPrepaAdversaire(){
  var ct=document.getElementById('scr-prepa');
  if(!ct) return;
  var conv=SAISON.CONVOS||{};
  if(!conv.adv){ ct.innerHTML='<div class="blk"><div class="blk-body"><div class="empty-txt">Aucun adversaire annoncé pour le moment</div></div></div>'; return; }
  var adv=(SAISON.ADVERSAIRES||[]).find(function(a){ return fexNomsCorrespondent(a.nom,conv.adv); });
  var fiche=adv&&adv.fiches&&adv.fiches.length?adv.fiches[0]:null;
  var ms=(SAISON.MATCHS||[]).filter(function(m){return fexNomsCorrespondent(m.adversaire,conv.adv);});
  var v=0,n=0,d=0;
  ms.forEach(function(m){ if(m.res==='V')v++; else if(m.res==='N')n++; else d++; });
  var html='<div class="hero-convoc"><div class="hero-eyebrow">🎯 Prochain adversaire</div><div class="convoc-adv">'+esc(conv.adv)+'</div>'
    +'<div class="convoc-meta">'+esc(conv.date||'')+(conv.lieu?' — '+esc(conv.lieu):'')+'</div></div>';
  html+='<div class="blk"><div class="blk-h"><span class="t">📊 Historique face à eux</span></div><div class="blk-body">';
  if(ms.length){
    html+='<div style="display:flex;gap:14px;margin-bottom:10px;font-size:14px"><span style="color:var(--green)">'+v+'V</span><span style="color:var(--gold)">'+n+'N</span><span style="color:var(--red)">'+d+'D</span><span style="color:var(--mute)">sur '+ms.length+' match(s)</span></div>'
      +ms.slice(0,5).map(function(m){
        var resCol=m.res==='V'?'var(--green)':m.res==='D'?'var(--red)':'var(--gold)';
        return '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--hair);font-size:13.5px"><span style="color:var(--mute)">'+esc(m.date||'')+'</span><span style="color:'+resCol+';font-weight:700">'+m.ast+'-'+m.adv+'</span></div>';
      }).join('');
  }else{
    html+='<div class="empty-txt">Première rencontre entre les deux équipes</div>';
  }
  html+='</div></div>';
  html+='<div class="blk"><div class="blk-h"><span class="t">📝 Analyse du coach</span></div><div class="blk-body">';
  if(fiche){
    if(fiche.dispoPoss||fiche.dispoDef){
      html+='<div class="fg2" style="margin-bottom:10px">'
        +(fiche.dispoPoss?'<div><div style="font-size:11px;color:var(--mute)">En possession</div><div style="font-size:14px;color:var(--ink)">'+esc(fiche.dispoPoss)+'</div></div>':'<div></div>')
        +(fiche.dispoDef?'<div><div style="font-size:11px;color:var(--mute)">À la perte</div><div style="font-size:14px;color:var(--ink)">'+esc(fiche.dispoDef)+'</div></div>':'<div></div>')
        +'</div>';
    }
    if(fiche.joueursSurveiller) html+='<div style="margin-bottom:8px"><div style="font-size:11px;color:var(--or)">⚠️ Joueurs à surveiller</div><div style="font-size:14px;color:var(--ink)">'+esc(fiche.joueursSurveiller)+'</div></div>';
    if(fiche.infosParticulieres) html+='<div><div style="font-size:11px;color:var(--mute)">📌 Infos particulières</div><div style="font-size:14px;color:var(--ink)">'+esc(fiche.infosParticulieres)+'</div></div>';
    if(fiche.lienVideo) html+='<a href="'+esc(fiche.lienVideo)+'" target="_blank" style="display:block;margin-top:10px;font-size:13.5px;color:var(--or);font-weight:700">🎬 Voir la vidéo</a>';
    if(!fiche.dispoPoss&&!fiche.dispoDef&&!fiche.joueursSurveiller&&!fiche.infosParticulieres&&!fiche.lienVideo) html+='<div class="empty-txt">Fiche vide pour l\'instant</div>';
  }else{
    html+='<div class="empty-txt">Pas encore d\'analyse du coach pour cet adversaire</div>';
  }
  html+='</div></div>';
  ct.innerHTML=html;
}
function renderCalendrierAnnuelJoueur(){
  var ct=document.getElementById('scr-calannuel');
  if(!ct) return;
  var maintenant=new Date();
  if(CAJ_ANNEE===null){ CAJ_ANNEE=maintenant.getFullYear(); CAJ_MOIS=maintenant.getMonth(); }
  ct.innerHTML='<div class="blk"><div class="blk-h"><span class="t">📆 Calendrier annuel</span></div><div class="blk-body">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    +'<span onclick="cajChangerMois(-1)" style="cursor:pointer;font-size:18px;padding:4px 10px">‹</span>'
    +'<span id="caj-mois-titre" style="font-family:Roboto Condensed,sans-serif;font-weight:700;font-size:16.5px"></span>'
    +'<span onclick="cajChangerMois(1)" style="cursor:pointer;font-size:18px;padding:4px 10px">›</span>'
    +'</div>'
    +'<div id="caj-grille" style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px"></div>'
    +'</div></div>'
    +'<div class="blk" id="caj-jour-detail-blk" style="display:none"><div class="blk-h"><span class="t" id="caj-jour-titre"></span></div><div class="blk-body" id="caj-jour-liste"></div></div>';
  cajRenderGrille();
}
function cajChangerMois(delta){
  CAJ_MOIS+=delta;
  if(CAJ_MOIS<0){ CAJ_MOIS=11; CAJ_ANNEE--; }
  if(CAJ_MOIS>11){ CAJ_MOIS=0; CAJ_ANNEE++; }
  var det=document.getElementById('caj-jour-detail-blk'); if(det) det.style.display='none';
  cajRenderGrille();
}
function cajRenderGrille(){
  document.getElementById('caj-mois-titre').textContent=MOIS_FR_NOMS[CAJ_MOIS]+' '+CAJ_ANNEE;
  var premierJour=new Date(CAJ_ANNEE,CAJ_MOIS,1).getDay();
  var decalage=premierJour===0?6:premierJour-1;
  var nbJours=new Date(CAJ_ANNEE,CAJ_MOIS+1,0).getDate();
  var aujourdhui=new Date();
  var html='';
  ['L','M','M','J','V','S','D'].forEach(function(j){ html+='<div style="text-align:center;font-size:10.5px;color:var(--mute);font-weight:700;padding-bottom:2px">'+j+'</div>'; });
  for(var i=0;i<decalage;i++) html+='<div></div>';
  for(var d=1;d<=nbJours;d++){
    var evts=caEvenementsDuJourJoueur(CAJ_ANNEE,CAJ_MOIS,d);
    var estAujourdhui=(CAJ_ANNEE===aujourdhui.getFullYear()&&CAJ_MOIS===aujourdhui.getMonth()&&d===aujourdhui.getDate());
    var fond=evts.length?CA_COULEURS[evts[0].type]:'rgba(255,255,255,.03)';
    var bord=estAujourdhui?'var(--or)':(evts.length?CA_BORDS[evts[0].type]:'var(--hair)');
    html+='<div onclick="cajOuvrirJour('+CAJ_ANNEE+','+CAJ_MOIS+','+d+')" style="cursor:pointer;min-height:44px;padding:3px;border-radius:5px;border:'+(estAujourdhui?'2px':'1px')+' solid '+bord+';background:'+fond+'">'
      +'<div style="font-size:12px;font-weight:'+(estAujourdhui?'800':'600')+';color:'+(estAujourdhui?'var(--or)':'var(--ink)')+'">'+d+'</div>'
      +(evts.length?'<div style="font-size:13px">'+(CA_ICONES[evts[0].type]||'•')+(evts.length>1?' +'+(evts.length-1):'')+'</div>':'')
      +'</div>';
  }
  document.getElementById('caj-grille').innerHTML=html;
}
function cajOuvrirJour(y,m,d){
  var evts=caEvenementsDuJourJoueur(y,m,d);
  document.getElementById('caj-jour-detail-blk').style.display='block';
  document.getElementById('caj-jour-titre').textContent=d+' '+MOIS_FR_NOMS[m]+' '+y;
  document.getElementById('caj-jour-liste').innerHTML=evts.length?evts.map(function(e){
    return '<div style="padding:6px 0;border-bottom:1px solid var(--hair);font-size:14px">'+(CA_ICONES[e.type]||'•')+' '+esc(e.texte)+'</div>';
  }).join(''):'<div class="empty-txt">Aucun évènement ce jour</div>';
}

function verifierCodeCoach(){
  var val=(document.getElementById('coach-code').value||'').trim().toUpperCase();
  if(val==='AST'){
    COACH_DEVERROUILLE=true;
    localStorage.setItem('ast_coach_ok','1');
    renderCoach();
  }else{
    var e=document.getElementById('coach-code-err');
    e.textContent='Code incorrect';
    e.classList.remove('hidden');
  }
}
function verrouillerCoach(){
  COACH_DEVERROUILLE=false;
  localStorage.removeItem('ast_coach_ok');
  renderCoach();
}

// ===== Objectifs & sondages (ajoutés sur l'Accueil) =====
async function envoyerPropositionObjectifs(){
  var choix=[];
  [0,1,2].forEach(function(n){
    var sel=document.getElementById('propobj-type-'+n);
    var cibleInput=document.getElementById('propobj-cible-'+n);
    if(sel.value && cibleInput.value){
      choix.push({type:sel.value,cible:parseFloat(cibleInput.value)});
    }
  });
  if(!choix.length){ notif('⚠ Choisis au moins un objectif avec une cible'); return; }
  var body={fields:{
    joueur:{stringValue:MON_NOM},
    choix:{stringValue:JSON.stringify(choix)},
    dateAffiche:{stringValue:new Date().toLocaleDateString('fr-FR')},
    message:{stringValue:document.getElementById('propobj-message').value.trim()}
  }};
  try{
    await fetch(FIRESTORE_BASE+'/objectifs_individuels_demandes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    document.getElementById('propobj-statut').textContent='✓ Envoyé au coach le '+new Date().toLocaleDateString('fr-FR');
    notif('✓ Proposition envoyée');
  }catch(e){
    notif('⚠ Envoi impossible — vérifie ta connexion');
  }
}

  ];
  html+='<div class="blk"><div class="blk-h"><span class="t">✍️ Proposer mes objectifs</span></div><div class="blk-body">'
    +'<div style="font-size:12.5px;color:var(--mute);margin-bottom:12px">Choisis jusqu\'à 3 objectifs pour la saison — le coach valide et les applique à ta fiche.</div>'
    +[0,1,2].map(function(n){
      return '<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--hair)">'
        +'<label class="fl">Objectif '+(n+1)+'</label>'
        +'<select class="fi" id="propobj-type-'+n+'" style="margin:6px 0 6px" onchange="document.getElementById(\'propobj-cible-'+n+'\').value=this.options[this.selectedIndex].dataset.def||\'\'">'
        +'<option value="">— Aucun —</option>'
        +OBJ_TYPES.map(function(t){return '<option value="'+t.id+'" data-label="'+esc(t.label)+'" data-unit="'+esc(t.unit)+'" data-def="'+t.def+'">'+esc(t.cat)+' — '+esc(t.label)+'</option>';}).join('')
        +'</select>'
        +'<input class="fi ninput" type="number" id="propobj-cible-'+n+'" placeholder="Cible chiffrée" style="width:100%">'
        +'</div>';
    }).join('')
    +'<label class="fl">Message pour le coach (facultatif)</label><textarea class="fi" id="propobj-message" rows="2" style="margin:6px 0 12px;resize:vertical" placeholder="Pourquoi ces objectifs ?"></textarea>'
    +'<button class="btn-or" onclick="envoyerPropositionObjectifs()">Envoyer au coach</button>'
    +'<div id="propobj-statut" style="font-size:12px;color:var(--mute);margin-top:8px"></div>'
    +'</div></div>';
  html+='<div class="blk"><div class="blk-h"><span class="t">🤝 Objectifs collectifs</span></div><div class="blk-body">';
  var objColl=SAISON.OBJ_COLL||[];
  html+=objColl.length?objColl.map(function(o){
    var pct=o.cible>0?Math.min(100,Math.round((o.actuel||0)/o.cible*100)):0;
    return '<div style="margin-bottom:10px"><div style="font-size:14px;color:#fff">'+(o.icon||'🎯')+' '+esc(o.label||'')+'</div>'
      +'<div style="font-size:12px;color:var(--gris2)">'+(o.actuel||0)+' / '+o.cible+' '+esc(o.unit||'')+'</div>'
      +'<div class="obj-bar-bg"><div class="obj-bar-fill" style="width:'+pct+'%"></div></div></div>';
  }).join(''):'<div class="empty-txt">Aucun objectif collectif pour l\'instant</div>';
  html+='</div></div>';
  ct.insertAdjacentHTML('beforeend',html);
}
async function chargerMesReponsesSondages(){
  try{
    var res=await fetch(FIRESTORE_BASE+'/sondage_reponses?pageSize=300');
    if(!res.ok) return {};
    var data=await res.json();
    var parSondage={};
    (data.documents||[]).forEach(function(doc){
      var f=doc.fields||{};
      if((f.joueur||{}).stringValue!==MON_NOM) return;
      parSondage[(f.sondageId||{}).stringValue]=(f.reponse||{}).stringValue||'';
    });
    return parSondage;
  }catch(e){ return {}; }
}
async function repondreSondage(sondageId,reponse){
  var body={fields:{
    sondageId:{stringValue:sondageId},
    joueur:{stringValue:MON_NOM},
    reponse:{stringValue:reponse},
    dateReponse:{stringValue:new Date().toISOString()}
  }};
  try{
    await fetch(FIRESTORE_BASE+'/sondage_reponses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    notif('✓ Réponse envoyée');
    renderSondage();
  }catch(e){
    notif('⚠ Envoi impossible — vérifie ta connexion');
  }
}
async function renderSondage(){
  var ct=document.getElementById('scr-accueil');
  if(!ct) return;
  var sondages=(SAISON.SONDAGES||[]).filter(function(s){return s.actif;});
  var mesReponses=sondages.length?await chargerMesReponsesSondages():{};
  var html='<div class="blk"><div class="blk-h"><span class="t">📊 Sondage en cours</span></div><div class="blk-body">';
  html+=sondages.length?sondages.map(function(s){
    var maReponse=mesReponses[s.id];
    return '<div style="margin-bottom:14px"><div style="font-size:14.5px;color:#fff;margin-bottom:8px;font-weight:600">'+esc(s.question||'')+'</div>'
      +(s.options||[]).map(function(o){
        var texte=typeof o==='string'?o:(o.texte||'');
        var estChoisi=maReponse===texte;
        return '<div onclick="'+(maReponse?'':'repondreSondage(\''+String(s.id).replace(/'/g,"\\'")+'\',\''+texte.replace(/'/g,"\\'")+'\')')+'" style="font-size:14px;padding:9px 12px;border-radius:8px;margin-bottom:5px;cursor:'+(maReponse?'default':'pointer')+';background:'+(estChoisi?'rgba(249,115,22,.18)':'rgba(255,255,255,.035)')+';border:1px solid '+(estChoisi?'var(--or)':'transparent')+';color:'+(estChoisi?'var(--or)':'var(--ink)')+';font-weight:'+(estChoisi?'700':'400')+'">'+(estChoisi?'✓ ':'')+esc(texte)+'</div>';
      }).join('')
      +(maReponse?'':'<div style="font-size:12px;color:var(--mute);margin-top:2px">Choisis une réponse</div>')
      +'</div>';
  }).join(''):'<div class="empty-txt">Aucun sondage en cours</div>';
  html+='</div></div>';
  ct.insertAdjacentHTML('beforeend',html);
}

init();

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
